<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Rounded square background (iOS icon shape) -->
  <rect width="180" height="180" rx="40" fill="#007AFF"/>

  <!-- Checklist lines -->
  <!-- Row 1: checked -->
  <circle cx="44" cy="68" r="11" fill="none" stroke="white" stroke-width="5"/>
  <polyline points="38,68 43,74 52,62" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="66" y="63" width="72" height="10" rx="5" fill="white"/>

  <!-- Row 2: checked -->
  <circle cx="44" cy="98" r="11" fill="none" stroke="white" stroke-width="5"/>
  <polyline points="38,98 43,104 52,92" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="66" y="93" width="58" height="10" rx="5" fill="white"/>

  <!-- Row 3: unchecked -->
  <circle cx="44" cy="128" r="11" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="5"/>
  <rect x="66" y="123" width="46" height="10" rx="5" fill="rgba(255,255,255,0.45)"/>
</svg>
