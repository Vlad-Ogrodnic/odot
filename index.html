<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tasks">
  <meta name="theme-color" content="#C1666B">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Tasks</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg:            #F5F1EA;
      --track:         #ECE7DD;
      --switch-off:    #E3DDD2;
      --sheet:         #FFFFFF;
      --text:          #221F1B;
      --text-dim:      #8C8478;
      --text-dimmer:   #B8B0A2;
      --sep:           rgba(34, 31, 26, 0.12);
      --accent:        #C1666B;
      --accent-text:   #FBF3EF;
      --done:          #4FA05A;
      --danger:        #C0392B;
      --warning:       #B8863B;
      /* Auto-assigned category colors (see catColorVar in the script) — a
         fixed palette rather than a color picker, so identity is automatic. */
      --cat-0:         #4C6899;
      --cat-1:         #A87A22;
      --cat-2:         #3D7A73;
      --cat-3:         #6B5596;
      --cat-4:         #9C6640;
      --cat-5:         #66803F;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:          #171512;
        --track:       #221F1B;
        --switch-off:  #3A3530;
        --sheet:       #201C18;
        --text:        #F2EFE9;
        --text-dim:    #8C867C;
        --text-dimmer: #5C574E;
        --sep:         rgba(242, 239, 233, 0.09);
        --done:        #6FBF73;
        --danger:      #E05D51;
        --warning:     #E0A94D;
        --cat-0:       #7B93B8;
        --cat-1:       #D2A24C;
        --cat-2:       #5C9A93;
        --cat-3:       #9B87C4;
        --cat-4:       #C98F6B;
        --cat-5:       #93A87C;
      }
    }

    html, body {
      height: 100%;
      /* Horizontal movement anywhere is always ours (swipe back out of a
         category, swipe a row to delete) — iOS never claims it as a pan
         and cancels the gesture. Vertical stays native scrolling. Also
         turns off pinch/double-tap zoom, which an app shouldn't have. */
      touch-action: pan-y;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      /* (Notch/home-indicator padding lives on .page, not here — see there.) */
      /* App-wide, not just on task rows: nothing here is document text meant
         to be selected, same as a native app's labels. Scoped to rows only
         (v12), iOS's long-press text selection still found selectable text
         elsewhere (header, count, chips) to latch onto mid-hold. */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* The current screen. Opaque and stacked above .nav-underlay, so the
       parent level only shows through where this has been slid aside. */
    .page {
      position: relative;
      z-index: 1;
      /* Always at least a full screen tall, even with only a task or two,
         or the level behind it shows through below its content while it
         slides away. The safe-area padding (clearing the notch/Dynamic
         Island and home indicator) is inside this box for the same reason —
         on body, as it used to be, it left uncovered strips at the edges. */
      min-height: 100vh;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: var(--bg);
    }

    .page.nav-moving {
      box-shadow: -8px 0 24px rgba(0, 0, 0, 0.18);
      will-change: transform;
    }

    /* The parent level, rendered into a copy of .page and parked behind the
       real one for the duration of a swipe back (or animated back tap).
       Its own scroll container, so its sticky header sticks just like the
       real page's does. */
    .nav-underlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: var(--bg);
      pointer-events: none;
      will-change: transform;
    }

    /* A copy mustn't replay the rows' slide-in entrance animation. */
    .nav-underlay * {
      animation: none !important;
    }

    /* Darkens the parent level while it's mostly covered, lifting as the
       current screen slides away — as iOS does. */
    .nav-dim {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #000;
      pointer-events: none;
    }

    /* Real text fields opt back in — they need a cursor, selection and the
       copy/paste callout. */
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    /* ── Header ──────────────────────────────────────── */
    .header {
      background: var(--bg);
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--sep);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .task-count {
      font-size: 13.5px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .settings-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      display: flex;
      line-height: 1;
      padding: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ── Settings sheet ──────────────────────────────── */
    .settings-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 30;
      align-items: flex-end;
    }

    .settings-overlay.visible {
      display: flex;
    }

    .settings-sheet {
      background: var(--sheet);
      width: 100%;
      border-radius: 20px 20px 0 0;
      padding: 18px 20px calc(20px + env(safe-area-inset-bottom));
      animation: slideUp 0.2s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .settings-header h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .settings-close {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 18px;
      padding: 6px;
      cursor: pointer;
    }

    .settings-action {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-top: 1px solid var(--sep);
      color: var(--accent);
      font-size: 16px;
      font-weight: 600;
      padding: 16px 4px;
      cursor: pointer;
      -webkit-appearance: none;
    }

    .settings-section-label {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-dim);
      padding: 14px 4px 8px;
    }

    /* The whole row is the <label>, so tapping anywhere on it flips the
       switch — not just the small switch itself. */
    .settings-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-top: 1px solid var(--sep);
      padding: 13px 4px;
      cursor: pointer;
    }

    .settings-toggle-title {
      display: block;
      font-size: 16px;
    }

    .settings-toggle-sub {
      display: block;
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* iOS-style switch, drawn by hand so it looks the same on every browser
       and uses the app's accent instead of system green. */
    .switch {
      -webkit-appearance: none;
      appearance: none;
      flex-shrink: 0;
      position: relative;
      width: 51px;
      height: 31px;
      margin: 0;
      border-radius: 16px;
      background: var(--switch-off);
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .switch::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease;
    }

    .switch:checked {
      background: var(--accent);
    }

    .switch:checked::before {
      transform: translateX(20px);
    }

    /* ── Input ───────────────────────────────────────── */
    .input-area {
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-area input {
      flex: 1;
      border: 1.5px solid var(--sep);
      background: var(--track);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 16px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }

    .input-area input:focus {
      border-color: var(--accent);
    }

    .input-area input::placeholder {
      color: var(--text-dim);
    }

    .add-btn {
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-appearance: none;
    }

    .add-btn:active {
      opacity: 0.8;
      transform: scale(0.97);
    }

    /* ── Status: segmented control ─────────────────────── */
    .filter-bar {
      padding: 4px 16px 14px;
    }

    .segmented {
      display: flex;
      gap: 4px;
      background: var(--track);
      border-radius: 14px;
      padding: 4px;
    }

    .filter-btn {
      flex: 1;
      text-align: center;
      padding: 11px 0;
      border-radius: 10px;
      border: none;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: var(--text-dim);
      -webkit-appearance: none;
    }

    .filter-btn.active {
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 700;
    }

    /* ── Done time-window (shown only while the Done tab is active) ──── */
    .window-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 16px 14px;
    }

    .window-btn {
      padding: 5px 13px;
      border-radius: 14px;
      border: 1px solid var(--sep);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: var(--text-dim);
      -webkit-appearance: none;
    }

    .window-btn.active {
      background: var(--track);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Categories (nested) ─────────────────────────── */
    .category-bar {
      padding: 0 16px 16px;
    }

    /* Title area: plain "Tasks" at root, or a back/name/options row inside a category */
    .title-group {
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
    }

    /* A plain type selector here (".title-group h1") would outrank
       .category-title's single-class specificity regardless of source
       order, silently overriding its font-size — so the root heading gets
       its own class instead of relying on the bare element. */
    .app-title {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 30px;
      line-height: 1;
      padding: 4px 6px 4px 0;
      margin-left: -6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .category-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .more-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 20px;
      line-height: 1;
      padding: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Plain colored text, no chip/bubble — each category keeps its own hue
       everywhere it appears. These are pure navigation (drill into a child),
       never a "selected filter", so none of them ever gets an active state. */
    .category-chips {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      font-size: 17px;
      font-weight: 700;
    }

    .cat-chip {
      background: none;
      border: none;
      padding: 4px 0;
      font: inherit;
      cursor: pointer;
    }

    .add-cat-btn {
      background: none;
      border: none;
      padding: 4px 0;
      font-size: 20px;
      line-height: 1;
      color: var(--text-dimmer);
      cursor: pointer;
    }

    /* Shown in place of the "+" while naming a new category: pick a color,
       then type the name. */
    .add-cat-form {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .category-color-input {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border: none;
      border-radius: 50%;
      overflow: hidden;
      padding: 0;
      cursor: pointer;
      background: none;
    }

    .category-add-input {
      border: none;
      border-bottom: 1.5px solid var(--accent);
      font-size: 16px; /* iOS Safari auto-zooms the page on focus for inputs under 16px */
      font-family: inherit;
      font-weight: 600;
      background: transparent;
      color: var(--text);
      outline: none;
      width: 100%;
      padding: 0 0 4px;
      -webkit-appearance: none;
    }

    /* Passive "which category is this from" indicator (aggregated views only) */
    .category-label {
      flex-shrink: 0;
      max-width: 90px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Highlighted while dragging a task over a valid category drop target */
    .drop-target-hover {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ── Task list ───────────────────────────────────── */
    /* Flat, continuous list with hairline dividers — no per-row card/shadow.
       That's this design's whole point: shape (cards, pills) is reserved for
       actual controls (the segmented control, the settings sheet), not spent
       on every repeated block. */
    .task-list {
      padding: 0 16px 32px;
    }

    /* Outer wrapper: clips the swipe-to-delete reveal and is what gets
       translated up/down during drag-to-reorder. */
    .task-item-wrapper {
      position: relative;
      overflow: hidden;
      animation: slideIn 0.2s ease;
    }

    .task-item-wrapper.dragging {
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      z-index: 5;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Red delete button revealed behind the row when swiped left */
    .delete-reveal {
      position: absolute;
      inset: 0;
      background: var(--danger);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 22px;
      cursor: pointer;
    }

    /* Icons are inline line-art SVGs (stroke = currentColor), not emoji:
       iOS renders emoji as full-color Apple artwork that ignores the palette
       and reads as clip-art next to native-style UI. */
    .icon {
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .delete-reveal-icon {
      color: #fff;
      width: 22px;
      height: 22px;
    }

    .settings-btn .icon {
      width: 23px;
      height: 23px;
    }

    /* The row that slides on top of .delete-reveal */
    .task-row {
      position: relative;
      z-index: 1;
      background: var(--bg);
      padding: 15px 0;
      border-bottom: 1px solid var(--sep);
      display: flex;
      align-items: center;
      gap: 13px;
      /* `pan-y`: a vertical move on a row is a real native iOS scroll
         (momentum, rubber-banding and all) unless the touch has already
         become one of our own gestures — a pickup or a swipe — at which
         point the non-passive touchmove listener in the script locks
         scrolling out for the rest of it. v12–v13 used `none` here to beat
         iOS's long-press text selection, which cost scrolling by touching a
         row at all; app-wide user-select:none on body now covers that. */
      touch-action: pan-y;
      /* Without this, holding a row to drag it also triggers the browser's
         native text-selection/callout on whatever text is under the finger. */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .task-item-wrapper:last-child .task-row {
      border-bottom: none;
    }

    .task-number {
      width: 20px;
      flex-shrink: 0;
      text-align: right;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      color: var(--text-dimmer);
    }

    /* Inline edit input, replaces .task-text while editing — explicitly
       selectable again, since it sits inside .task-row which turns
       selection off for everything else. */
    .edit-input {
      flex: 1;
      min-width: 0;
      font-size: 16.5px;
      line-height: 1.4;
      font-family: inherit;
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
      color: var(--text);
      background: transparent;
      border: none;
      border-bottom: 1.5px solid var(--accent);
      outline: none;
      padding: 0 0 2px;
      -webkit-appearance: none;
    }

    /* Circular checkbox */
    .check-circle {
      width: 23px;
      height: 23px;
      border-radius: 50%;
      border: 1.5px solid var(--text-dimmer);
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
      user-select: none;
    }

    .check-circle.done {
      background: var(--done);
      border-color: var(--done);
    }

    .check-circle .checkmark {
      display: none;
      color: var(--bg);
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      margin-top: 1px;
    }

    .check-circle.done .checkmark {
      display: block;
    }

    /* Task text */
    .task-text {
      flex: 1;
      font-size: 16.5px;
      line-height: 1.4;
      word-break: break-word;
      transition: color 0.15s;
    }

    .task-text.done {
      text-decoration: line-through;
      color: var(--text-dim);
    }

    /* Text plus an optional meta line under it; this, not .task-text, is the
       flexible column and the tap-to-edit target. */
    .task-main {
      flex: 1;
      min-width: 0;
    }

    .task-meta {
      font-size: 13px;
      color: var(--text-dim); /* not --text-dimmer: too faint to read at 13px in dark mode */
      margin-top: 3px;
    }

    /* ── Empty state ─────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 64px 24px 32px;
      color: var(--text-dim);
    }

    .empty-icon {
      font-size: 52px;
      display: block;
      margin-bottom: 14px;
      line-height: 1;
    }

    .empty-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .empty-sub {
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Offline banner ──────────────────────────────── */
    .offline-banner {
      display: none;
      background: var(--warning);
      color: var(--bg);
      text-align: center;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
    }

    .offline-banner.visible {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Everything that slides away when swiping back out of a category (see
       "Swipe right to go back" in the script). The settings sheet stays
       outside it: it's position:fixed, which a transformed ancestor would
       break. -->
  <div class="page" id="page">

  <div class="offline-banner" id="offlineBanner">You're offline — all changes are saved locally</div>

  <div class="header">
    <div class="header-top">
      <div class="title-group" id="titleGroup"></div>
      <button class="settings-btn" onclick="openSettings()" aria-label="Settings">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <div class="task-count" id="taskCount">No tasks yet</div>
  </div>

  <div class="filter-bar">
    <div class="segmented">
      <button class="filter-btn active" data-filter="all"   onclick="setFilter('all',   this)">All</button>
      <button class="filter-btn"        data-filter="active" onclick="setFilter('active', this)">Active</button>
      <button class="filter-btn"        data-filter="done"   onclick="setFilter('done',   this)">Done</button>
    </div>
  </div>

  <div id="doneWindowChips"></div>

  <div class="category-bar">
    <div class="category-chips" id="categoryChips"></div>
  </div>

  <div class="input-area">
    <input
      type="text"
      id="taskInput"
      placeholder="What needs to be done?"
      maxlength="300"
      autocomplete="off"
      autocorrect="on"
      spellcheck="true"
    >
    <button class="add-btn" id="addBtn" onclick="addTask()">Add</button>
  </div>

  <div class="task-list" id="taskList"></div>

  </div><!-- /.page -->

  <div class="settings-overlay" id="settingsOverlay" onclick="if(event.target===this) closeSettings()">
    <div class="settings-sheet">
      <div class="settings-header">
        <h2>Settings</h2>
        <button class="settings-close" onclick="closeSettings()" aria-label="Close">✕</button>
      </div>
      <div class="settings-section-label">Display</div>
      <label class="settings-toggle">
        <span>
          <span class="settings-toggle-title">Show all tasks on main screen</span>
          <span class="settings-toggle-sub">Off: only tasks without a category</span>
        </span>
        <input type="checkbox" class="switch" id="settingRootShowsAll"
               onchange="setSetting('rootShowsAll', this.checked)">
      </label>
      <label class="settings-toggle">
        <span>
          <span class="settings-toggle-title">Show completion time</span>
          <span class="settings-toggle-sub">When each done task was finished</span>
        </span>
        <input type="checkbox" class="switch" id="settingShowCompletedAt"
               onchange="setSetting('showCompletedAt', this.checked)">
      </label>
      <div class="settings-section-label">Backup</div>
      <button class="settings-action" onclick="exportTasks()">Export tasks</button>
      <button class="settings-action" onclick="document.getElementById('importFile').click()">Import tasks</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="handleImportFile(event)">
    </div>
  </div>

<script>
  // ── State ──────────────────────────────────────────────────────────────
  let tasks  = [];
  let filter = 'all';
  let editingId = null;
  let categories = [];
  let currentCategoryId = null; // null = root/"All"
  let addingCategory = false;
  let addingCategoryColor = '#4C6899'; // hex color chosen so far in the in-progress add-category form
  // Opening the color picker blurs the name input, which would otherwise
  // commit (and tear down) the add-category form mid-selection. Set on pointerdown —
  // which reliably fires before blur on both touch and mouse — and consumed
  // once by the input's blur handler. More robust here than relying on
  // focus-event relatedTarget, which touch-triggered blur on iOS Safari
  // doesn't always populate.
  let skipNextCategoryBlur = false;
  let doneWindow = 'all'; // 'today' | 'week' | 'month' | 'all' — only relevant when filter === 'done'

  const STORAGE_KEY    = 'todo_tasks_v1';
  const CATEGORIES_KEY = 'todo_categories_v1';
  const SETTINGS_KEY   = 'todo_settings_v1';

  // Display preferences from the settings sheet. Stored as a partial object
  // merged over these defaults, so a setting added later just picks up its
  // default on devices that saved settings before it existed.
  const DEFAULT_SETTINGS = {
    rootShowsAll:    true, // main screen shows every task (false: only uncategorized ones)
    showCompletedAt: true, // done tasks show when they were completed
  };
  let settings = { ...DEFAULT_SETTINGS };

  // ── Persistence ────────────────────────────────────────────────────────
  function load() {
    try {
      tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    } catch {
      tasks = [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (e) {
      console.warn('Storage write failed:', e);
    }
  }

  function loadCategories() {
    try {
      categories = JSON.parse(localStorage.getItem(CATEGORIES_KEY) || '[]');
    } catch {
      categories = [];
    }
  }

  function saveCategories() {
    try {
      localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
    } catch (e) {
      console.warn('Storage write failed:', e);
    }
  }

  function loadSettings() {
    try {
      settings = { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') };
    } catch {
      settings = { ...DEFAULT_SETTINGS };
    }
  }

  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    } catch (e) {
      console.warn('Storage write failed:', e);
    }
  }

  // ── Task operations ────────────────────────────────────────────────────
  function addTask() {
    const input = document.getElementById('taskInput');
    const text  = input.value.trim();
    if (!text) {
      input.focus();
      return;
    }

    // Appended, not prepended: the list reads top-down in the order tasks
    // were added (the user's choice). No scroll-to-new-task — the input sits
    // above the list and stays focused for adding several in a row, so
    // scrolling down to each new task would pull the input off-screen and
    // make iOS bounce back up to it on the next keystroke.
    tasks.push({
      id:        Date.now(),
      text,
      done:      false,
      createdAt: new Date().toISOString(),
      categoryId: currentCategoryId,
    });

    save();
    input.value = '';
    input.focus();
    render();
  }

  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    task.done = !task.done;
    if (task.done) task.completedAt = new Date().toISOString();
    save();
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  // Reorders by id, not raw array index: the visible list (after status AND
  // category filtering) is a scattered subset of `tasks`, so the dragged/target
  // positions from the DOM can't be spliced directly into the full array.
  // Instead: compute the new relative order of just the visible ids, then walk
  // the full array substituting visible tasks from that new order in place —
  // every non-visible task keeps its original position untouched.
  function commitReorder(visibleIds, fromIndex, toIndex) {
    if (fromIndex === toIndex) return;
    const newOrder = visibleIds.slice();
    const [movedId] = newOrder.splice(fromIndex, 1);
    newOrder.splice(toIndex, 0, movedId);

    const byId = new Map(tasks.map(t => [t.id, t]));
    const visibleSet = new Set(visibleIds);
    let cursor = 0;
    tasks = tasks.map(t => visibleSet.has(t.id) ? byId.get(newOrder[cursor++]) : t);
    save();
  }

  // ── Editing ────────────────────────────────────────────────────────────
  function startEdit(id) {
    editingId = id;
    render();
    const input = document.getElementById(`edit-${id}`);
    if (input) {
      input.focus();
      const len = input.value.length;
      input.setSelectionRange(len, len); // cursor at end, not select-all — editing should extend text, not wipe it
    }
  }

  function commitEdit(id) {
    const input = document.getElementById(`edit-${id}`);
    if (!input) return; // already committed/cancelled
    const value = input.value.trim();
    const task  = tasks.find(t => t.id === id);
    if (task && value) {
      task.text = value;
      save();
    }
    editingId = null;
    render();
  }

  function cancelEdit() {
    editingId = null;
    render();
  }

  // ── Categories (nested) ────────────────────────────────────────────────
  function getChildren(parentId) {
    return categories.filter(c => c.parentId === parentId);
  }

  function getDescendantIds(id) {
    const result = [];
    const stack  = [id];
    while (stack.length) {
      const current = stack.pop();
      for (const c of categories) {
        if (c.parentId === current) {
          result.push(c.id);
          stack.push(c.id);
        }
      }
    }
    return result;
  }

  // Category color: whatever was explicitly picked when it was created.
  // - string  → a literal hex color, chosen freely via the color picker.
  // - number  → legacy: an index into the old fixed --cat-0..5 palette,
  //             from categories created back when that's all there was.
  // - missing → older still, from before any picker existed — falls back to
  //             a stable hash of the id instead of losing color entirely.
  const CATEGORY_HUES = 6;
  function catColorVar(cat) {
    if (cat && typeof cat.color === 'string') return cat.color;
    const idx = cat && typeof cat.color === 'number' ? cat.color : (cat ? cat.id % CATEGORY_HUES : 0);
    return `var(--cat-${idx})`;
  }

  // Each level remembers where it was scrolled when you drilled into a child,
  // and going back returns you there — while a freshly opened level starts
  // at the top. Both as in any iOS navigation stack. Keyed by category id,
  // with null for the root.
  const scrollMemory = new Map();

  function parentCategoryId(id) {
    const cat = categories.find(c => c.id === id);
    return cat ? (cat.parentId ?? null) : null;
  }

  function navigateToCategory(id) {
    scrollMemory.set(currentCategoryId, window.scrollY);
    currentCategoryId = id;
    render();
    window.scrollTo(0, 0);
  }

  // The back chevron: the same slide-away animation a swipe back finishes
  // with (see "Swipe right to go back"), so tapping and swiping feel like
  // one gesture.
  function navigateUp() {
    if (currentCategoryId === null || nav || backSwipe) return;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      beginNavTransition();
      endNavTransition(true);
      return;
    }
    beginNavTransition();
    settleNav(true, 0);
  }

  // Mirrors startEdit/commitEdit/cancelEdit's inline-swap pattern, so adding a
  // category feels like the same action as adding/editing a task instead of a
  // separate native-popup interaction.
  function startAddCategory() {
    addingCategory = true;
    addingCategoryColor = '#4C6899'; // just a starting point — freely changeable before confirming
    render();
    const input = document.getElementById('categoryAddInput');
    if (input) input.focus();
  }

  // Called as the native color picker reports a new value. Doesn't go
  // through render() — that would wipe out whatever name the user has
  // already typed (a fresh render rebuilds the input from scratch, empty).
  function selectAddCategoryColor(hex) {
    addingCategoryColor = hex;
    // Opening the color picker blurs the name field; the blur handler
    // already ignores that (see skipNextCategoryBlur), but bring focus back
    // so typing can continue without an extra tap.
    const input = document.getElementById('categoryAddInput');
    if (input) input.focus();
  }

  // Names must be unique app-wide (not just among siblings) — two categories
  // with the same name is confusing regardless of where they sit in the tree.
  function categoryNameExists(name, excludeId = null) {
    const lower = name.toLowerCase();
    return categories.some(c => c.id !== excludeId && c.name.toLowerCase() === lower);
  }

  function commitAddCategory() {
    const input = document.getElementById('categoryAddInput');
    addingCategory = false;
    if (!input) { render(); return; }
    const name = input.value.trim();
    if (name) {
      if (categoryNameExists(name)) {
        alert(`A category named "${name}" already exists.`);
        addingCategory = true;
        render();
        const retryInput = document.getElementById('categoryAddInput');
        if (retryInput) { retryInput.value = name; retryInput.focus(); }
        return;
      }
      categories.push({ id: Date.now(), name, color: addingCategoryColor, parentId: currentCategoryId, createdAt: new Date().toISOString() });
      saveCategories();
    }
    render();
  }

  function cancelAddCategory() {
    addingCategory = false;
    render();
  }

  function renameOrDeleteCurrentCategory() {
    if (currentCategoryId === null) return; // can't rename/delete the root
    const cat = categories.find(c => c.id === currentCategoryId);
    if (!cat) return;

    const input = prompt('Rename category (clear the text and press OK to delete):', cat.name);
    if (input === null) return; // cancelled
    const trimmed = input.trim();

    if (trimmed === '') {
      const idsToDelete = new Set([cat.id, ...getDescendantIds(cat.id)]);
      const ok = confirm(`Delete "${cat.name}"${idsToDelete.size > 1 ? ' and its subcategories' : ''}? Tasks inside will be moved to Uncategorized — nothing is deleted.`);
      if (!ok) return;
      tasks.forEach(t => {
        if (t.categoryId !== null && t.categoryId !== undefined && idsToDelete.has(t.categoryId)) {
          t.categoryId = null;
        }
      });
      categories = categories.filter(c => !idsToDelete.has(c.id));
      currentCategoryId = cat.parentId;
      save();
      saveCategories();
      render();
      return;
    }

    if (trimmed !== cat.name) {
      if (categoryNameExists(trimmed, cat.id)) {
        alert(`A category named "${trimmed}" already exists.`);
        return;
      }
      cat.name = trimmed;
      saveCategories();
      render();
    }
  }

  function assignTaskCategory(taskId, categoryIdStr) {
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    task.categoryId = categoryIdStr === '' ? null : Number(categoryIdStr);
    save();
    render();
  }

  // ── Settings sheet ─────────────────────────────────────────────────────
  function openSettings() {
    document.getElementById('settingRootShowsAll').checked    = settings.rootShowsAll;
    document.getElementById('settingShowCompletedAt').checked = settings.showCompletedAt;
    document.getElementById('settingsOverlay').classList.add('visible');
  }

  function setSetting(key, value) {
    settings[key] = value;
    saveSettings();
    render(); // the list is visible behind the sheet, so the change shows immediately
  }

  function closeSettings() {
    document.getElementById('settingsOverlay').classList.remove('visible');
  }

  // ── Export / Import ────────────────────────────────────────────────────
  function exportTasks() {
    if (tasks.length === 0 && categories.length === 0) {
      alert('Nothing to export yet.');
      return;
    }

    const json     = JSON.stringify({ categories, tasks }, null, 2);
    const filename = `tasks-${new Date().toISOString().slice(0, 10)}.json`;
    const file     = new File([json], filename, { type: 'application/json' });

    // On iOS, sharing the file lets you save it to Files, AirDrop it, etc.
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Tasks backup' }).catch(() => {});
      return;
    }

    // Desktop / unsupported browsers: fall back to a plain download.
    const url = URL.createObjectURL(file);
    const a   = document.createElement('a');
    a.href     = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function handleImportFile(event) {
    const file = event.target.files[0];
    event.target.value = ''; // reset so importing the same file again still fires onchange
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch {
        alert("That file isn't valid JSON.");
        return;
      }

      // Accept the legacy bare-array format (tasks only) as well as the
      // current { categories, tasks } shape.
      let importedTasks, importedCategories;
      if (Array.isArray(parsed)) {
        importedTasks = parsed;
        importedCategories = [];
      } else if (parsed && Array.isArray(parsed.tasks)) {
        importedTasks = parsed.tasks;
        importedCategories = Array.isArray(parsed.categories) ? parsed.categories : [];
      } else {
        alert('Expected a JSON file containing tasks (and optionally categories).');
        return;
      }

      // Merge categories first, matching by (name, resolved parent) so two
      // different branches can each have a same-named child without merging
      // into one. Recursion (rather than assuming file order) resolves a
      // category's parent on demand, memoized in categoryIdRemap.
      const categoryIdRemap = new Map(); // imported category id -> final id in `categories`
      const byImportedId    = new Map(importedCategories.filter(c => c && typeof c.id !== 'undefined').map(c => [c.id, c]));

      // Category names are unique app-wide, so a name match (regardless of
      // parent) unambiguously means "this is the same category" — matched
      // ones keep their existing local placement rather than being reparented
      // to wherever the import file had them.
      function resolveCategory(importedCat) {
        if (categoryIdRemap.has(importedCat.id)) return categoryIdRemap.get(importedCat.id);

        const importedName = typeof importedCat.name === 'string' ? importedCat.name : 'Unnamed';
        const existing = categories.find(c => c.name.toLowerCase() === importedName.toLowerCase());
        if (existing) {
          categoryIdRemap.set(importedCat.id, existing.id);
          return existing.id;
        }

        let finalParentId = null;
        if (importedCat.parentId !== null && importedCat.parentId !== undefined) {
          const parentImported = byImportedId.get(importedCat.parentId);
          finalParentId = parentImported ? resolveCategory(parentImported) : null;
        }

        let finalId = Date.now() + categories.length + categoryIdRemap.size;
        while (categories.some(c => c.id === finalId)) finalId++;
        categories.push({
          id: finalId,
          name: importedName,
          parentId: finalParentId,
          // Kept in either stored generation catColorVar() understands (hex
          // string, or old palette index) — strictly validated, since the
          // value is written unescaped into a style="" attribute and an
          // import file is untrusted input. Anything else falls back to no
          // color, which catColorVar() also handles.
          ...((typeof importedCat.color === 'string' && /^#[0-9a-f]{6}$/i.test(importedCat.color)) ||
              (Number.isInteger(importedCat.color) && importedCat.color >= 0 && importedCat.color < CATEGORY_HUES)
            ? { color: importedCat.color } : {}),
          createdAt: typeof importedCat.createdAt === 'string' ? importedCat.createdAt : new Date().toISOString(),
        });
        categoryIdRemap.set(importedCat.id, finalId);
        return finalId;
      }

      importedCategories.forEach(c => { if (c && typeof c.id !== 'undefined') resolveCategory(c); });

      // Merge tasks: unchanged dedupe-by-id logic, plus remapping categoryId
      // through the table built above (an unresolvable reference falls back
      // to Uncategorized rather than dropping the task).
      const existingIds = new Set(tasks.map(t => t.id));
      let added = 0, skipped = 0;

      for (const item of importedTasks) {
        if (!item || typeof item.text !== 'string' || !item.text.trim()) {
          skipped++;
          continue;
        }
        if (typeof item.id === 'number' && existingIds.has(item.id)) {
          skipped++;
          continue;
        }
        let id = typeof item.id === 'number' ? item.id : Date.now() + added;
        while (existingIds.has(id)) id++;
        existingIds.add(id);

        const categoryId = (item.categoryId !== null && item.categoryId !== undefined && categoryIdRemap.has(item.categoryId))
          ? categoryIdRemap.get(item.categoryId)
          : null;

        tasks.push({
          id,
          text:      item.text.trim(),
          done:      !!item.done,
          createdAt: typeof item.createdAt === 'string' ? item.createdAt : new Date().toISOString(),
          ...(typeof item.completedAt === 'string' ? { completedAt: item.completedAt } : {}),
          categoryId,
        });
        added++;
      }

      save();
      saveCategories();
      render();
      alert(`Imported ${added} task${added === 1 ? '' : 's'}.` + (skipped ? ` Skipped ${skipped} invalid/duplicate.` : ''));
    };
    reader.readAsText(file);
  }

  // ── Filter ─────────────────────────────────────────────────────────────
  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function setDoneWindow(w) {
    doneWindow = w;
    render();
  }

  // A task with no completedAt (done before this existed) falls back to
  // createdAt, so it still lands somewhere sensible instead of never
  // matching a window.
  function isWithinWindow(task, window) {
    if (window === 'all') return true;
    const ts = new Date(task.completedAt || task.createdAt).getTime();
    if (Number.isNaN(ts)) return true;
    const now = Date.now();
    const DAY = 24 * 60 * 60 * 1000;
    if (window === 'today') return new Date(ts).toDateString() === new Date(now).toDateString();
    if (window === 'week')  return now - ts < 7 * DAY;
    if (window === 'month') return now - ts < 30 * DAY;
    return true;
  }

  function renderDoneWindowChips() {
    if (filter !== 'done') return '';
    const options = [['today', 'Today'], ['week', 'Last week'], ['month', 'Last month'], ['all', 'All time']];
    const chips = options
      .map(([val, label]) => `<button class="window-btn ${doneWindow === val ? 'active' : ''}" onclick="setDoneWindow('${val}')">${label}</button>`)
      .join('');
    return `<div class="window-chips">${chips}</div>`;
  }

  // ── Render ─────────────────────────────────────────────────────────────
  // `root` is the live page by default; swiping back also renders the parent
  // level into a detached copy of it (see beginNavTransition), which is why
  // elements are looked up within root rather than by document-wide id.
  function render(root = document) {
    const $ = id => root.querySelector('#' + id);
    const listEl      = $('taskList');
    const countEl     = $('taskCount');

    // Any open swipe or in-progress drag is visually reset by a fresh render.
    openSwipeId = null;

    // Title area (root heading, or back/name/options when inside a category),
    // the child-category chip row, and the Done-only time-window row.
    const titleGroupEl = $('titleGroup');
    titleGroupEl.innerHTML = renderTitleGroup();
    titleGroupEl.dataset.categoryDrop = currentCategoryId === null ? '' : String(currentCategoryId);
    $('categoryChips').innerHTML = renderCategoryChips();
    $('doneWindowChips').innerHTML = renderDoneWindowChips();

    // A category view includes tasks filed directly in it AND anywhere in its
    // subtree — so "Done" under "Work" also shows done tasks from "Work/Client
    // A", instead of only tasks filed in "Work" itself. At root this means
    // every task in the app — unless the "Show all tasks on main screen"
    // setting is off, in which case root shows only uncategorized tasks.
    const inScope = (currentCategoryId === null && !settings.rootShowsAll)
      ? new Set([null])
      : new Set([currentCategoryId, ...getDescendantIds(currentCategoryId)]);
    const categoryTasks = tasks.filter(t => inScope.has(t.categoryId ?? null));
    const total       = categoryTasks.length;
    const doneCount   = categoryTasks.filter(t => t.done).length;
    const activeCount = total - doneCount;

    // Update count label
    if (total === 0) {
      countEl.textContent = 'No tasks yet';
    } else {
      countEl.textContent = `${activeCount} remaining · ${doneCount} done`;
    }

    // Further filter by status tab (and, in Done, the time window) on top of
    // the category scope above
    const visible = categoryTasks.filter(t => {
      if (filter === 'active') return !t.done;
      if (filter === 'done')   return  t.done && isWithinWindow(t, doneWindow);
      return true;
    });

    // Empty state
    if (visible.length === 0) {
      const msgs = {
        all:    { icon: '📝', title: 'Nothing here yet',     sub: 'Type a task above and tap Add' },
        active: { icon: '✅', title: 'All caught up!',       sub: 'No active tasks remaining'     },
        done:   doneWindow === 'all'
          ? { icon: '🎯', title: 'Nothing completed yet', sub: 'Finish a task to see it here' }
          : { icon: '🎯', title: 'Nothing here',          sub: 'No tasks completed in this time range' },
      };
      // Main screen filtered down to uncategorized tasks, and there are none:
      // say why it's empty, instead of "nothing here yet" while the user
      // knows full well they have tasks.
      const m = (total === 0 && currentCategoryId === null && !settings.rootShowsAll && tasks.length > 0)
        ? { icon: '🗂', title: 'No uncategorized tasks', sub: 'Tasks in categories are hidden here — see Settings' }
        : msgs[filter];
      listEl.innerHTML = `
        <div class="empty-state">
          <span class="empty-icon">${m.icon}</span>
          <div class="empty-title">${m.title}</div>
          <div class="empty-sub">${m.sub}</div>
        </div>`;
      return;
    }

    // Task items
    listEl.innerHTML = visible.map((task, index) => `
      <div class="task-item-wrapper" id="task-${task.id}" data-id="${task.id}">
        <div class="delete-reveal" onclick="deleteTask(${task.id})" aria-label="Delete task">
          <svg class="icon delete-reveal-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 6h18"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            <path d="M10 11v6"/>
            <path d="M14 11v6"/>
          </svg>
        </div>
        <div class="task-row">
          <div class="task-number">${index + 1}</div>
          <div class="check-circle ${task.done ? 'done' : ''}"
               onclick="toggleTask(${task.id})"
               role="checkbox"
               aria-checked="${task.done}"
               aria-label="Mark complete">
            <span class="checkmark">✓</span>
          </div>
          ${editingId === task.id
            ? `<input class="edit-input" id="edit-${task.id}" type="text" maxlength="300"
                      value="${escAttr(task.text)}"
                      autocomplete="off" autocorrect="on" spellcheck="true"
                      onkeydown="if(event.key==='Enter'){this.blur();}else if(event.key==='Escape'){cancelEdit();}"
                      onblur="commitEdit(${task.id})">`
            : `<div class="task-main" onclick="startEdit(${task.id})">
                 <div class="task-text ${task.done ? 'done' : ''}">${escHtml(task.text)}</div>
                 ${renderTaskMeta(task)}
               </div>`
          }
          ${renderCategoryLabel(task)}
        </div>
      </div>
    `).join('');
  }

  function renderTitleGroup() {
    if (currentCategoryId === null) {
      return `<h1 class="app-title">Tasks v18</h1>`;
    }
    const cat   = categories.find(c => c.id === currentCategoryId);
    const name  = cat ? escHtml(cat.name) : 'Category';
    const color = catColorVar(cat);
    return `
      <button class="back-btn" onclick="navigateUp()" aria-label="Back">‹</button>
      <h1 class="category-title" style="color:${color}">${name}</h1>
      <button class="more-btn" onclick="renameOrDeleteCurrentCategory()" aria-label="Category options">⋯</button>
    `;
  }

  // Children are pure navigation (tap to drill in) — never a "selected
  // filter" — so every chip renders the same way, in its own color, with no
  // active/inactive distinction to invent. The trailing "›" echoes the
  // header's "‹" back button: one visual language for "this moves you".
  function renderCategoryChips() {
    const children = getChildren(currentCategoryId);
    const chips = children
      .map(c => `<button class="cat-chip" data-category-drop="${c.id}" style="color:${catColorVar(c)}" onclick="navigateToCategory(${c.id})">${escHtml(c.name)} ›</button>`)
      .join('');
    const addControl = addingCategory
      ? `<div class="add-cat-form">
           <input type="color" class="category-color-input" id="categoryColorInput"
                  value="${addingCategoryColor}" aria-label="Category color"
                  onpointerdown="skipNextCategoryBlur=true"
                  oninput="selectAddCategoryColor(this.value)">
           <input class="category-add-input" id="categoryAddInput" type="text" maxlength="60"
                  placeholder="Category name" autocomplete="off"
                  onkeydown="if(event.key==='Enter'){this.blur();}else if(event.key==='Escape'){cancelAddCategory();}"
                  onblur="if(skipNextCategoryBlur){skipNextCategoryBlur=false;}else{commitAddCategory();}">
         </div>`
      : `<button class="add-cat-btn" onclick="startAddCategory()" aria-label="Add category">+</button>`;
    return chips + addControl;
  }

  // Passive indicator only — re-filing a task is done by pressing and holding
  // it, then dragging onto a category chip or the title area (see
  // startPress/beginDrag/onDragMove/onDragEnd), not by picking from a control
  // here. Only shown when the task's actual category differs from the one
  // currently being browsed, since that's the only time it's not already
  // obvious (aggregated views mix subcategories).
  function renderCategoryLabel(task) {
    const taskCategoryId = task.categoryId ?? null;
    if (taskCategoryId === currentCategoryId) return '';
    const cat   = categories.find(c => c.id === taskCategoryId);
    const name  = cat ? cat.name : 'Uncategorized';
    const color = cat ? catColorVar(cat) : 'var(--text-dimmer)';
    return `<span class="category-label" style="color:${color}">${escHtml(name)}</span>`;
  }

  // The small line under a task's text. Only completion time for now; tasks
  // done before completedAt existed have none, so they show nothing rather
  // than a made-up time.
  function renderTaskMeta(task) {
    if (!settings.showCompletedAt || !task.done || !task.completedAt) return '';
    const when = formatCompletedAt(task.completedAt);
    return when ? `<div class="task-meta">Completed ${when}</div>` : '';
  }

  // "today, 14:32" / "yesterday, 09:05" / "Monday, 18:00" within the past
  // week, then "12 Sep" (plus the year once it's not this year). Month and
  // day names are spelled out here instead of via toLocale*String, which
  // would follow the phone's language and mix it into this English UI.
  const MONTHS   = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  function formatCompletedAt(iso) {
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return '';
    const now  = new Date();
    const time = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    // Calendar-day difference, not elapsed/24h — 23:50 yesterday is
    // "yesterday" at 00:10 today. Rounded because a DST switch makes one
    // day 23 or 25 hours long.
    const dayStart = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const days = Math.round((dayStart(now) - dayStart(d)) / (24 * 60 * 60 * 1000));
    if (days === 0) return `today, ${time}`;
    if (days === 1) return `yesterday, ${time}`;
    if (days > 1 && days < 7) return `${WEEKDAYS[d.getDay()]}, ${time}`;
    const date = `${d.getDate()} ${MONTHS[d.getMonth()]}`;
    return d.getFullYear() === now.getFullYear() ? date : `${date} ${d.getFullYear()}`;
  }

  // ── Helpers ────────────────────────────────────────────────────────────
  function escHtml(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(str));
    return d.innerHTML;
  }

  function escAttr(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ── Keyboard ───────────────────────────────────────────────────────────
  document.getElementById('taskInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  // ── Tap / swipe-to-delete / press-and-hold-to-reorder ────────────────────
  // All three are one gesture funnel, delegated from the list container so
  // listeners survive full re-renders. Any press on a row starts "pending":
  // release quickly with little movement and it's an ordinary tap (native
  // click fires on the checkbox/text beneath, untouched by any of this);
  // move sideways past the threshold first and it resolves as swipe-to-delete;
  // move vertically first and it's left as a normal page scroll; hold still
  // long enough and it "picks up" the row for reordering/re-filing — the same
  // vertical-drag + category-drop-target mechanics as before, just entered by
  // a hold instead of a dedicated handle.
  const taskListEl = document.getElementById('taskList');

  const SWIPE_OPEN      = -76; // px the row slides to reveal the delete button
  const SWIPE_THRESHOLD = 40;  // px drag needed to toggle open/closed
  const LONG_PRESS_MS   = 250; // hold duration before a still press picks the row up
  const PICKUP_MS       = 120; // pop animation when a row is first picked up
  const SETTLE_MS       = 160; // ease-into-place animation when a row is dropped
  // Keep SETTLE_MS < LONG_PRESS_MS: beginDrag() cancels any pending settle
  // via clearTimeout(settleTimer), with no check for which row it belonged
  // to. That's fine only because a new drag can't physically arm until
  // LONG_PRESS_MS after its own touch starts, by which point a shorter
  // previous settle has always already finished on its own.
  const AUTOSCROLL_ZONE = 80;  // px band at the list's visible top/bottom edge where a held row scrolls the page
  const AUTOSCROLL_MAX  = 900; // px/s at the very edge of that band (eases in quadratically from its inner side)
  const AUTOSCROLL_ARM  = 12;  // px the finger must travel after pickup before edge-scrolling can start,
                               // so picking up a row that already sits near an edge doesn't lurch the page
  const headerEl = document.querySelector('.header');

  let openSwipeId       = null; // id of the currently swiped-open row, if any
  let pressState        = null;
  let longPressTimer    = null;
  let dragState         = null;
  let settleTimer       = null; // pending post-drop commit; cancelled by re-grabbing the same row mid-settle
  let suppressClick     = false;
  let highlightedDropEl = null; // category chip/title currently hovered while dragging

  function updateDropHighlight(dropEl) {
    if (highlightedDropEl === dropEl) return;
    if (highlightedDropEl) highlightedDropEl.classList.remove('drop-target-hover');
    highlightedDropEl = dropEl || null;
    if (highlightedDropEl) highlightedDropEl.classList.add('drop-target-hover');
  }

  // A capturing click listener lets us swallow the "tap" that merely closed
  // an open swipe, so it doesn't also fire the checkbox/edit handler beneath it.
  taskListEl.addEventListener('click', e => {
    // dragState (not just suppressClick): pointer capture is supposed to
    // route the eventual pointerup — and whatever click iOS synthesizes
    // from it — to the dragged row, but Safari's touch-to-click pipeline
    // doesn't reliably honor capture the way mouse-based pointer capture
    // does. With siblings visually sliding into the dragged row's old slot
    // mid-drag, a misrouted click can land on whichever row now happens to
    // sit at the finger's screen position — toggling its checkbox or
    // opening it for edit for an instant. No click is ever a real, intended
    // one while a drag is in flight, so swallow all of them unconditionally.
    if (suppressClick || dragState) {
      suppressClick = false;
      e.stopPropagation();
      e.preventDefault();
    }
  }, true);

  // Belt-and-suspenders on top of the CSS user-select:none above: on real
  // iOS Safari, a sustained hold can still visually kick off native text
  // selection (most reliably on a short, isolated run like the category
  // label) even though user-select says it isn't selectable. selectstart
  // fires right as that's about to happen, so canceling it here stops it
  // outright — the CSS alone wasn't enough on-device.
  taskListEl.addEventListener('selectstart', e => {
    if (e.target.closest('.edit-input')) return; // editing still needs real text selection
    e.preventDefault();
  });

  // Last line of defense against that same long-press selection, which has
  // outlasted every other measure here before: if one appears anyway while
  // a row is held, clear it the moment it does.
  document.addEventListener('selectionchange', () => {
    if (!dragState) return;
    const sel = window.getSelection();
    if (sel && !sel.isCollapsed) sel.removeAllRanges();
  });

  // Native scrolling stays on for any touch (touch-action: pan-y) until the
  // touch becomes one of our own gestures — then this locks the page in
  // place for the rest of it, like a native list does once a row is picked
  // up or swiped sideways, or a screen is being swiped back. Pointer events
  // can't do this on iOS (preventDefault on pointermove never stops a
  // scroll); a non-passive touchmove listener can, but only if it's already
  // attached when the touch begins — hence registered once, up front, rather
  // than per gesture. On iOS pointermove fires before its touchmove, so the
  // gesture state below is already up to date by the time this runs.
  document.addEventListener('touchmove', e => {
    const mode = pressState?.mode;
    const ours = mode === 'drag' || mode === 'swipe' || backSwipe?.active;
    if (ours && e.cancelable) e.preventDefault();
  }, { passive: false });

  taskListEl.addEventListener('pointerdown', e => {
    // Actively editing — this is a real text field, let it handle its own
    // touch behavior (cursor placement, native select-word/select-all)
    // undisturbed rather than arming the row-press machinery under it.
    if (e.target.closest('.edit-input')) return;

    suppressClick = false;

    const wrapperEl = e.target.closest('.task-item-wrapper');
    const targetId  = wrapperEl ? Number(wrapperEl.dataset.id) : null;

    // Tapping/pressing anywhere while a different row is swiped open just
    // closes that row first.
    if (openSwipeId !== null && openSwipeId !== targetId) {
      closeSwipe();
      suppressClick = true;
    }

    const deleteBtn = e.target.closest('.delete-reveal');
    const row       = e.target.closest('.task-row');

    if (deleteBtn) return; // let its own onclick handle deletion
    if (row) {
      // Belt-and-suspenders alongside the app-wide user-select:none and the
      // selectstart/selectionchange guards above against iOS's native
      // long-press text selection. (Doesn't block native scrolling —
      // preventDefault on a pointer event never does.)
      e.preventDefault();
      startPress(e, row);
    }
  });

  function closeSwipe() {
    if (openSwipeId == null) return;
    const row = taskListEl.querySelector(`#task-${openSwipeId} .task-row`);
    if (row) {
      row.style.transition = 'transform 0.2s ease';
      row.style.transform  = 'translateX(0px)';
    }
    openSwipeId = null;
  }

  function startPress(e, row) {
    const wrapper = row.closest('.task-item-wrapper');
    const id      = Number(wrapper.dataset.id);
    const isOpen  = openSwipeId === id;

    pressState = {
      id, row, wrapper,
      pointerId: e.pointerId,
      startX: e.clientX,
      startY: e.clientY,
      lastX:  e.clientX, // latest finger position, so a pickup starts exactly where the finger is now
      lastY:  e.clientY,
      baseX:  isOpen ? SWIPE_OPEN : 0,
      wasOpen: isOpen,
      mode: null, // null (pending) | 'swipe' | 'scroll' | 'drag'
    };

    // Pointer capture is deferred until a gesture is actually confirmed
    // (swipe or drag) — capturing immediately would retarget the plain-tap
    // click event to the row itself, breaking checkbox toggling and
    // tap-to-edit.
    row.style.transition = 'none';
    row.addEventListener('pointermove', onPressMove);
    row.addEventListener('pointerup', onPressEnd);
    row.addEventListener('pointercancel', onPressEnd);

    longPressTimer = setTimeout(beginDrag, LONG_PRESS_MS);
  }

  function onPressMove(e) {
    if (!pressState) return;

    if (pressState.mode === 'drag') {
      onDragMove(e);
      return;
    }

    pressState.lastX = e.clientX;
    pressState.lastY = e.clientY;
    const dx = e.clientX - pressState.startX;
    const dy = e.clientY - pressState.startY;

    if (pressState.mode === null) {
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) && dx > 0 && backSwipe) {
        // Rightward inside a category is the swipe back, which is already
        // tracking this same touch (it arms on pointerdown, before this
        // funnel, and only when no row is swiped open). Step aside entirely.
        endPress();
        return;
      } else if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
        clearTimeout(longPressTimer);
        pressState.mode = 'swipe';
        // Capture now that a swipe is confirmed, so a plain tap elsewhere
        // still targets the checkbox/text underneath undisturbed.
        pressState.row.setPointerCapture(pressState.pointerId);
      } else if (Math.abs(dy) > 8) {
        // Early vertical movement reads as an attempt to scroll the page,
        // not pick the row up — cancel the hold and let it scroll normally.
        clearTimeout(longPressTimer);
        pressState.mode = 'scroll';
      }
    }

    if (pressState.mode === 'swipe') {
      const x = Math.max(SWIPE_OPEN, Math.min(0, pressState.baseX + dx));
      pressState.row.style.transform = `translateX(${x}px)`;
    }
    // mode 'scroll', or still pending: nothing to do here.
  }

  // Stops tracking the current press without acting on it.
  function endPress() {
    clearTimeout(longPressTimer);
    pressState.row.removeEventListener('pointermove', onPressMove);
    pressState.row.removeEventListener('pointerup', onPressEnd);
    pressState.row.removeEventListener('pointercancel', onPressEnd);
    pressState = null;
  }

  function onPressEnd(e) {
    if (!pressState) return;
    clearTimeout(longPressTimer);

    const { row, id, mode, wasOpen } = pressState;
    row.removeEventListener('pointermove', onPressMove);
    row.removeEventListener('pointerup', onPressEnd);
    row.removeEventListener('pointercancel', onPressEnd);

    if (mode === 'drag') {
      onDragEnd();
    } else if (mode === 'swipe') {
      const dx = e.clientX - pressState.startX;
      const finalX = pressState.baseX + dx;
      const shouldOpen = finalX < -SWIPE_THRESHOLD;
      row.style.transition = 'transform 0.2s ease';
      row.style.transform  = shouldOpen ? `translateX(${SWIPE_OPEN}px)` : 'translateX(0px)';
      openSwipeId = shouldOpen ? id : null;
    } else if (mode === null && wasOpen) {
      // A plain tap on a row that was already open just closes it.
      row.style.transition = 'transform 0.2s ease';
      row.style.transform  = 'translateX(0px)';
      openSwipeId = null;
      suppressClick = true;
    }
    // Otherwise (plain tap on a closed row, or a scroll): do nothing and let
    // the native click fire on the checkbox/text beneath.

    pressState = null;
  }

  // Fires after LONG_PRESS_MS of holding still — "picks up" the row for
  // reordering/re-filing. A no-op if the touch already resolved as a swipe/
  // scroll, or was released, before the timer got here.
  function beginDrag() {
    if (!pressState || pressState.mode !== null) return;
    pressState.mode = 'drag';
    openSwipeId = null; // this row can't still be "open" once it's being dragged
    // Re-grabbing a row before its previous drop finished settling should
    // start clean, not race with that drop's still-pending commit/render.
    clearTimeout(settleTimer);

    const wrapper = pressState.wrapper;
    pressState.row.setPointerCapture(pressState.pointerId);
    pressState.row.style.transform = ''; // clear any partial swipe offset
    pressState.row.style.transition = '';

    const wrappers   = Array.from(taskListEl.querySelectorAll('.task-item-wrapper'));
    const startIndex = wrappers.indexOf(wrapper);
    const visibleIds = wrappers.map(w => Number(w.dataset.id));
    // Every row's own layout box, measured once up front: rows differ in
    // height (long tasks wrap), so reordering can't assume they're all as
    // tall as the dragged one. offsetTop/offsetHeight rather than
    // getBoundingClientRect because they ignore transforms (a sibling still
    // mid-slideIn, the pickup pop below) and don't change as the page scrolls.
    const layouts = wrappers.map(w => ({ top: w.offsetTop, height: w.offsetHeight }));

    dragState = {
      startIndex, currentIndex: startIndex, wrapper, wrappers, visibleIds, layouts,
      startY: pressState.lastY, startScrollY: window.scrollY,
      lastX:  pressState.lastX, lastY: pressState.lastY,
      autoScrollArmed: false, scrollCarry: 0, lastFrame: null, rafId: null, dropped: false,
      dropTarget: undefined,
    };

    wrapper.classList.add('dragging');
    // The dragged row otherwise occludes whatever is really underneath it
    // (it paints above normal-flow siblings while its z-index is raised),
    // which would make elementFromPoint find itself instead of the chip/
    // header actually being hovered — so it's excluded from hit-testing.
    wrapper.style.pointerEvents = 'none';

    // A quick pop on pickup — the "grabbed it" feedback native drag
    // reordering (Shortcuts, Home Screen icons) gives instantly.
    wrapper.style.transition = `transform ${PICKUP_MS}ms ease`;
    wrapper.style.transform  = 'scale(1.025)';

    dragState.rafId = requestAnimationFrame(autoScrollFrame);
  }

  function onDragMove(e) {
    if (!dragState) return;
    dragState.lastX = e.clientX;
    dragState.lastY = e.clientY;
    if (Math.abs(e.clientY - dragState.startY) > AUTOSCROLL_ARM) dragState.autoScrollArmed = true;
    updateDrag();
  }

  // Positions the dragged row and its siblings for the finger's latest
  // position. Driven both by finger movement (onDragMove) and by the page
  // scrolling underneath a still finger (autoScrollFrame).
  function updateDrag() {
    const d = dragState;
    // Finger travel plus however far the page has auto-scrolled since pickup:
    // the row lives in the scrolling content, so without the scroll term it
    // would drift away from the finger as the page moves under it.
    // Capped so the row's bottom never passes the last row's: a transformed
    // row still stretches the page's scrollable height, so dragging it lower
    // while edge-scrolling down would grow the page, scroll further, drag the
    // row lower still — scrolling off into blank space forever. (No cap going
    // up: the chips and header up there are re-file targets it must reach.)
    const last   = d.layouts[d.layouts.length - 1];
    const own    = d.layouts[d.startIndex];
    const offset = Math.min(
      (d.lastY - d.startY) + (window.scrollY - d.startScrollY),
      (last.top + last.height) - (own.top + own.height),
    );
    // No transition here — the row should track the finger 1:1 with no lag.
    // Only the pickup pop and the drop settle (below) animate.
    d.wrapper.style.transition = 'none';
    d.wrapper.style.transform  = `translateY(${offset}px) scale(1.025)`;

    // Dragging onto a category chip or the title area re-files the task
    // there instead of reordering it — check that before the reorder math.
    const dropEl = document.elementFromPoint(d.lastX, d.lastY)?.closest('[data-category-drop]');
    updateDropHighlight(dropEl || null);

    if (dropEl) {
      d.dropTarget = dropEl.dataset.categoryDrop;
      d.currentIndex = d.startIndex; // no reorder while re-filing
      d.wrappers.forEach(w => {
        if (w !== d.wrapper) w.style.transform = '';
      });
      return;
    }
    d.dropTarget = undefined;

    const newIndex = slotIndexFor(offset);
    if (newIndex === d.currentIndex) return; // siblings are already shifted for this slot

    const s = d.startIndex;
    const h = d.layouts[s].height;
    d.wrappers.forEach((w, i) => {
      if (w === d.wrapper) return;
      let shift = 0;
      if (i > s && i <= newIndex)      shift = -h;
      else if (i < s && i >= newIndex) shift = h;
      w.style.transition = 'transform 0.15s ease';
      w.style.transform  = shift ? `translateY(${shift}px)` : '';
    });

    d.currentIndex = newIndex;
  }

  // Which slot the dragged row would land in if dropped now, given how far
  // it's been moved from its own. It swaps past a sibling once its leading
  // edge (bottom going down, top going up) crosses that sibling's midpoint —
  // the edge rather than its own center, so a tall row dragged past short
  // ones (or a short one past tall ones) swaps as it visibly overlaps them
  // instead of noticeably early or late. With equal heights this is exactly
  // "half a row", same as before rows could differ.
  function slotIndexFor(offset) {
    const { layouts, startIndex: s } = dragState;
    const top    = layouts[s].top + offset;
    const bottom = top + layouts[s].height;
    const mid    = i => layouts[i].top + layouts[i].height / 2;
    let i = s;
    if (offset > 0) { while (i + 1 < layouts.length && bottom > mid(i + 1)) i++; }
    else            { while (i - 1 >= 0 && top < mid(i - 1)) i--; }
    return i;
  }

  // How far the dragged row sits from its original spot once in slot
  // `index`: the combined height of every sibling it moved past.
  function slotOffset(index) {
    const { layouts, startIndex: s } = dragState;
    let y = 0;
    for (let i = s + 1; i <= index; i++) y += layouts[i].height;
    for (let i = index; i < s; i++)      y -= layouts[i].height;
    return y;
  }

  // Scrolls the page while a held row sits near the top/bottom edge of the
  // list's visible area, so a row can be moved further than one screen —
  // faster the closer to the edge, like Reminders. Runs every frame for the
  // whole drag (a finger resting in the zone sends no pointer events of its
  // own to drive it).
  function autoScrollFrame(now) {
    const d = dragState;
    if (!d || d.dropped) return;
    const dt = d.lastFrame === null ? 0 : Math.min(now - d.lastFrame, 50);
    d.lastFrame = now;

    // Hovering a re-file target means "drop it here", not "keep scrolling".
    const v = d.autoScrollArmed && d.dropTarget === undefined ? autoScrollVelocity(d.lastY) : 0;
    if (v) {
      // Page scroll positions only move in whole pixels, so fractional
      // per-frame amounts are carried over — otherwise slow speeds near the
      // zone's inner edge would round down to never moving at all.
      d.scrollCarry += v * dt / 1000;
      const step = Math.trunc(d.scrollCarry);
      if (step) {
        d.scrollCarry -= step;
        const before = window.scrollY;
        window.scrollBy(0, step);
        if (window.scrollY !== before) updateDrag();
      }
    } else {
      d.scrollCarry = 0;
    }
    d.rafId = requestAnimationFrame(autoScrollFrame);
  }

  // px/s to scroll for a finger at viewport y: negative (up) in the band just
  // below the sticky header, positive (down) in the band at the screen's
  // bottom, 0 elsewhere. The header itself is excluded — it's a re-file drop
  // target (the current category), not part of the scroll zone.
  function autoScrollVelocity(y) {
    const top    = headerEl.getBoundingClientRect().bottom;
    const bottom = window.innerHeight;
    let depth = 0;
    if (y < top) return 0;
    if (y < top + AUTOSCROLL_ZONE)         depth = y - (top + AUTOSCROLL_ZONE);
    else if (y > bottom - AUTOSCROLL_ZONE) depth = y - (bottom - AUTOSCROLL_ZONE);
    const t = Math.min(1, Math.abs(depth) / AUTOSCROLL_ZONE);
    return Math.sign(depth) * AUTOSCROLL_MAX * t * t;
  }

  function onDragEnd() {
    if (!dragState) return;
    const { wrapper, wrappers, startIndex, currentIndex, visibleIds, dropTarget } = dragState;

    dragState.dropped = true; // stops autoScrollFrame
    cancelAnimationFrame(dragState.rafId);
    updateDropHighlight(null);
    // dragState stays set through the settle below (cleared in the timeout,
    // not here) — the click listener checks it to swallow the stray click
    // iOS sometimes fires against a sibling right as the drag ends (see that
    // listener). Only the click/selectionchange guards read it until then,
    // so leaving it set this long doesn't block a fresh press elsewhere.

    // Ease the dragged row from wherever the finger left it into the gap its
    // siblings already opened up for it. The siblings themselves are left
    // exactly as onDragMove last shifted them — resetting them now, ahead of
    // the dragged row catching up, would snap them back to their pre-drag
    // spots while the dragged row is still animating toward a slot sized for
    // the shifted layout, i.e. the two would visibly disagree for 160ms.
    const finalY = dropTarget !== undefined ? 0 : slotOffset(currentIndex);
    wrapper.style.transition = `transform ${SETTLE_MS}ms ease`;
    wrapper.style.transform  = `translateY(${finalY}px) scale(1)`;

    // A plain timeout, not transitionend, drives the commit: dropping a row
    // back exactly where it started wouldn't change these style values, so
    // transitionend would never fire and everything would stay stuck mid-drag.
    settleTimer = setTimeout(() => {
      dragState = null;
      wrappers.forEach(w => {
        w.style.transition = '';
        w.style.transform  = '';
      });
      wrapper.classList.remove('dragging');
      wrapper.style.pointerEvents = '';

      if (dropTarget !== undefined) {
        assignTaskCategory(visibleIds[startIndex], dropTarget); // already re-renders
      } else {
        commitReorder(visibleIds, startIndex, currentIndex);
        render();
      }
    }, SETTLE_MS);
  }

  // ── Swipe right to go back ───────────────────────────────────────────
  // Modeled on iOS's own back swipe — the full-screen kind iOS 26 gives
  // every app, not just the left-edge one. Inside a category, a rightward
  // swipe starting anywhere slides the whole current screen off to the right
  // under the finger, 1:1, revealing the parent level underneath, which
  // drifts in from a slight leftward offset (parallax) while a dim over it
  // lifts. Letting go past halfway, or with a rightward flick, finishes the
  // slide at the finger's speed; otherwise it springs back and nothing
  // changes. Vertical-first touches stay native scrolls; a leftward swipe on
  // a row is still swipe-to-delete.
  //
  // The parent is a real render of that level into a copy of the page
  // (render(root)) — not a screenshot — shown at the scroll position it was
  // left at. The live page itself stays untouched until the slide actually
  // completes, so the element under the finger is never ripped out of the
  // DOM mid-gesture (touch events stop reaching the document if it is,
  // which would take away the scroll lock above).
  const pageEl = document.getElementById('page');

  const NAV_ARM        = 8;    // px of horizontal-dominant travel that commits a touch to swiping back (same as a row swipe)
  const NAV_PARALLAX   = 0.3;  // fraction of the screen width the parent level starts offset to the left
  const NAV_DIM        = 0.15; // opacity of the dim over the parent level at the start
  const NAV_FLICK      = 0.35; // px/ms: a release this fast decides the outcome by direction alone
  const NAV_MIN_MS     = 180;  // settle animation duration bounds; within them it matches the finger's speed
  const NAV_MAX_MS     = 350;  //   (and a tapped back button, starting from rest, gets the max — iOS's pop duration)
  const NAV_EASE       = 'cubic-bezier(0.2, 0.8, 0.2, 1)'; // fast start, long gentle landing — like UIKit's spring
  const NAV_SAMPLE_MS  = 100;  // window of recent finger positions used to measure release velocity

  let backSwipe          = null; // the touch being tracked as a possible/actual swipe back
  let nav                = null; // the transition on screen: { parentId, underlay, dim, width, x }
  let navClickGuardUntil = 0;

  // Armed on every eligible touch, in the capture phase so it's set before
  // the row funnel's own pointerdown runs (that funnel checks for it when
  // deciding a rightward move isn't its to handle). Touch only: a mouse
  // drag on desktop should stay a mouse drag.
  document.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch' || !e.isPrimary) return;
    if (currentCategoryId === null || nav || backSwipe) return;
    // Busy with something else that a sideways swipe would clash with — a
    // held row, an open delete button (a press anywhere just closes it
    // first), or text being typed.
    if (dragState || openSwipeId !== null || editingId !== null || addingCategory) return;
    if (e.target.closest('input, textarea, .settings-overlay')) return;

    backSwipe = { pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, originX: 0, active: false, samples: [] };
    document.addEventListener('pointermove', onBackMove);
