<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tasks">
  <meta name="theme-color" content="#C1666B">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Tasks</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Everything that slides away when swiping back out of a category (see
       js/nav.js). The settings sheet stays outside it: it's position:fixed,
       which a transformed ancestor would break. -->
  <div class="page" id="page">

  <div class="offline-banner" id="offlineBanner">You're offline — all changes are saved locally</div>

  <div class="header">
    <div class="header-top">
      <div class="title-group" id="titleGroup"></div>
      <button class="settings-btn" onclick="openSettings()" aria-label="Settings">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <div class="task-count" id="taskCount">No tasks yet</div>
  </div>

  <div class="filter-bar">
    <div class="segmented">
      <button class="filter-btn active" data-filter="all"   onclick="setFilter('all',   this)">All</button>
      <button class="filter-btn"        data-filter="active" onclick="setFilter('active', this)">Active</button>
      <button class="filter-btn"        data-filter="done"   onclick="setFilter('done',   this)">Done</button>
    </div>
  </div>

  <div id="doneWindowChips"></div>

  <div class="category-bar">
    <div class="category-chips" id="categoryChips"></div>
  </div>

  <div class="input-area">
    <input
      type="text"
      id="taskInput"
      placeholder="What needs to be done?"
      maxlength="300"
      autocomplete="off"
      autocorrect="on"
      spellcheck="true"
    >
    <button class="add-btn" id="addBtn" onclick="addTask()">Add</button>
  </div>

  <div class="task-list" id="taskList"></div>

  </div><!-- /.page -->

  <div class="sheet-overlay" id="settingsOverlay" onclick="if(event.target===this) closeSettings()">
    <div class="settings-sheet">
      <div class="settings-header">
        <h2>Settings</h2>
        <button class="settings-close" onclick="closeSettings()" aria-label="Close">✕</button>
      </div>
      <div class="settings-section-label">Display</div>
      <label class="settings-toggle">
        <span>
          <span class="settings-toggle-title">Show all tasks on main screen</span>
          <span class="settings-toggle-sub">Off: only tasks without a category</span>
        </span>
        <input type="checkbox" class="switch" id="settingRootShowsAll"
               onchange="setSetting('rootShowsAll', this.checked)">
      </label>
      <label class="settings-toggle">
        <span>
          <span class="settings-toggle-title">Show completion time</span>
          <span class="settings-toggle-sub">When each done task was finished</span>
        </span>
        <input type="checkbox" class="switch" id="settingShowCompletedAt"
               onchange="setSetting('showCompletedAt', this.checked)">
      </label>
      <label class="settings-toggle">
        <span>
          <span class="settings-toggle-title">Task details</span>
          <span class="settings-toggle-sub">Tap a task for notes and due date. Off: tap to edit its text</span>
        </span>
        <input type="checkbox" class="switch" id="settingTaskDetails"
               onchange="setSetting('taskDetails', this.checked)">
      </label>
      <div class="settings-section-label">Backup</div>
      <div class="backup-status" id="backupStatus"></div>
      <button class="settings-action" onclick="exportTasks()">Export tasks</button>
      <button class="settings-action" onclick="document.getElementById('importFile').click()">Import tasks</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="handleImportFile(event)">
    </div>
  </div>

  <!-- Task details: opened by tapping a task's text (js/detail.js). Every
       change saves as it's made — there's no Cancel. -->
  <div class="sheet-overlay" id="detailOverlay" onclick="if(event.target===this) closeDetail()">
    <div class="detail-sheet" id="detailSheet" role="dialog" aria-label="Task details">
      <!-- Drag this strip down to dismiss, like a native iOS sheet. -->
      <div class="detail-handle" id="detailHandle">
        <div class="sheet-grabber"></div>
        <div class="detail-topbar">
          <button class="detail-done" onclick="closeDetail()">Done</button>
        </div>
      </div>
      <div class="detail-body" id="detailBody">
        <textarea class="detail-title" id="detailTitle" rows="1" maxlength="300"
                  placeholder="Title" autocomplete="off" autocorrect="on" spellcheck="true"
                  oninput="onDetailTitleInput()" onkeydown="onDetailTitleKeydown(event)"
                  onblur="onDetailTitleBlur()"></textarea>
        <textarea class="detail-notes" id="detailNotes" rows="3" maxlength="5000"
                  placeholder="Notes" autocorrect="on" spellcheck="true"
                  oninput="onDetailNotesInput()"></textarea>

        <div class="detail-group">
          <label class="settings-toggle">
            <span class="settings-toggle-title">Date</span>
            <input type="checkbox" class="switch" id="detailDateSwitch" onchange="setDetailHasDate(this.checked)">
          </label>
          <div class="detail-picker-row" id="detailDateRow">
            <input type="date" class="detail-picker" id="detailDate" onchange="setDetailDate(this.value)">
            <span class="detail-picker-hint" id="detailDateHint"></span>
          </div>
          <label class="settings-toggle" id="detailTimeToggle">
            <span class="settings-toggle-title">Time</span>
            <input type="checkbox" class="switch" id="detailTimeSwitch" onchange="setDetailHasTime(this.checked)">
          </label>
          <div class="detail-picker-row" id="detailTimeRow">
            <input type="time" class="detail-picker" id="detailTime" onchange="setDetailTime(this.value)">
          </div>
        </div>

        <div class="detail-info" id="detailInfo"></div>
        <button class="detail-delete" onclick="deleteFromDetail()">Delete task</button>
      </div>
    </div>
  </div>

  <!-- Plain classic scripts, not ES modules, loaded in this order: they
       share one global scope (top-level functions and let/const are visible
       across files), which is what the inline onclick="" handlers above rely
       on. Only app.js runs anything at load that reaches into other files,
       so it must stay last. Any file added here must also be added to ASSETS
       in sw.js, or the app breaks offline. -->
  <script src="js/state.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/render.js"></script>
  <script src="js/gestures.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
