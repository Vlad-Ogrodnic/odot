<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tasks">
  <meta name="theme-color" content="#007AFF">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Tasks</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --accent:        #007AFF;
      --accent-light:  #E5F0FF;
      --bg:            #F2F2F7;
      --card:          #FFFFFF;
      --text:          #1C1C1E;
      --text-secondary:#8E8E93;
      --separator:     #E5E5EA;
      --danger:        #FF3B30;
      --success:       #34C759;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --accent-light:  #1A2E4A;
        --bg:            #000000;
        --card:          #1C1C1E;
        --text:          #FFFFFF;
        --text-secondary:#8E8E93;
        --separator:     #38383A;
      }
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      /* Respect iPhone notch and home indicator */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* ── Header ──────────────────────────────────────── */
    .header {
      background: var(--card);
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--separator);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .task-count {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* ── Input ───────────────────────────────────────── */
    .input-area {
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--separator);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-area input {
      flex: 1;
      border: 1.5px solid var(--separator);
      background: var(--bg);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 16px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }

    .input-area input:focus {
      border-color: var(--accent);
    }

    .input-area input::placeholder {
      color: var(--text-secondary);
    }

    .add-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-appearance: none;
    }

    .add-btn:active {
      opacity: 0.8;
      transform: scale(0.97);
    }

    /* ── Filter tabs ─────────────────────────────────── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      padding: 10px 16px;
      gap: 8px;
    }

    /* ── Export / Import ─────────────────────────────── */
    .io-actions {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-left: auto;
    }

    .io-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 0;
    }

    .filter-btn {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1.5px solid var(--separator);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: var(--card);
      color: var(--text-secondary);
      transition: all 0.15s;
      -webkit-appearance: none;
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* ── Done time-window (shown only while the Done tab is active) ──── */
    .window-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 16px 10px;
    }

    .window-btn {
      padding: 4px 12px;
      border-radius: 14px;
      border: 1px solid var(--separator);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      background: var(--card);
      color: var(--text-secondary);
      -webkit-appearance: none;
    }

    .window-btn.active {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Categories (nested) ─────────────────────────── */
    .category-bar {
      padding: 0 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Title area: plain "Tasks" at root, or a back/name/options row inside a category */
    .title-group {
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
    }

    .title-group h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 30px;
      line-height: 1;
      padding: 4px 6px 4px 0;
      margin-left: -6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .category-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .more-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 20px;
      line-height: 1;
      padding: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .category-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .category-add-input {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--accent);
      font-size: 14px;
      font-family: inherit;
      background: var(--card);
      color: var(--text);
      outline: none;
      min-width: 120px;
      -webkit-appearance: none;
    }

    /* Passive "which category is this from" indicator (aggregated views only) */
    .category-label {
      flex-shrink: 0;
      max-width: 90px;
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg);
      border-radius: 8px;
      padding: 3px 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Highlighted while dragging a task over a valid category drop target */
    .drop-target-hover {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ── Task list ───────────────────────────────────── */
    .task-list {
      padding: 0 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Outer wrapper: clips the swipe-to-delete reveal to the rounded corners
       and is what gets translated up/down during drag-to-reorder. */
    .task-item-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
      animation: slideIn 0.2s ease;
    }

    .task-item-wrapper.dragging {
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
      z-index: 5;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Red delete button revealed behind the row when swiped left */
    .delete-reveal {
      position: absolute;
      inset: 0;
      background: var(--danger);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 22px;
      border-radius: 14px;
      cursor: pointer;
    }

    .delete-reveal-icon {
      color: #fff;
      font-size: 19px;
      line-height: 1;
    }

    /* The visible white row that slides on top of .delete-reveal */
    .task-row {
      position: relative;
      z-index: 1;
      background: var(--card);
      border-radius: 14px;
      padding: 14px 14px 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      touch-action: pan-y;
    }

    /* Drag handle for reordering (vertical drag) */
    .drag-handle {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 18px;
      line-height: 1;
      cursor: grab;
      touch-action: none;
    }

    /* Inline edit input, replaces .task-text while editing */
    .edit-input {
      flex: 1;
      min-width: 0;
      font-size: 16px;
      line-height: 1.4;
      font-family: inherit;
      color: var(--text);
      background: transparent;
      border: none;
      border-bottom: 1.5px solid var(--accent);
      outline: none;
      padding: 0 0 2px;
      -webkit-appearance: none;
    }

    /* Circular checkbox */
    .check-circle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--separator);
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
      user-select: none;
    }

    .check-circle.done {
      background: var(--success);
      border-color: var(--success);
    }

    .check-circle .checkmark {
      display: none;
      color: white;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      margin-top: 1px;
    }

    .check-circle.done .checkmark {
      display: block;
    }

    /* Task text */
    .task-text {
      flex: 1;
      font-size: 16px;
      line-height: 1.4;
      word-break: break-word;
      transition: color 0.15s;
    }

    .task-text.done {
      text-decoration: line-through;
      color: var(--text-secondary);
    }

    /* ── Empty state ─────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 64px 24px 32px;
      color: var(--text-secondary);
    }

    .empty-icon {
      font-size: 52px;
      display: block;
      margin-bottom: 14px;
      line-height: 1;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .empty-sub {
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Offline banner ──────────────────────────────── */
    .offline-banner {
      display: none;
      background: #FF9500;
      color: white;
      text-align: center;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 500;
    }

    .offline-banner.visible {
      display: block;
    }
  </style>
</head>
<body>

  <div class="offline-banner" id="offlineBanner">You're offline — all changes are saved locally</div>

  <div class="header">
    <div class="header-top">
      <div class="title-group" id="titleGroup"></div>
    </div>
    <div class="task-count" id="taskCount">No tasks yet</div>
  </div>

  <div class="input-area">
    <input
      type="text"
      id="taskInput"
      placeholder="What needs to be done?"
      maxlength="300"
      autocomplete="off"
      autocorrect="on"
      spellcheck="true"
    >
    <button class="add-btn" id="addBtn" onclick="addTask()">Add</button>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all"   onclick="setFilter('all',   this)">All</button>
    <button class="filter-btn"        data-filter="active" onclick="setFilter('active', this)">Active</button>
    <button class="filter-btn"        data-filter="done"   onclick="setFilter('done',   this)">Done</button>
    <div class="io-actions">
      <button class="io-btn" onclick="exportTasks()">Export</button>
      <button class="io-btn" onclick="document.getElementById('importFile').click()">Import</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="handleImportFile(event)">
    </div>
  </div>

  <div id="doneWindowChips"></div>

  <div class="category-bar">
    <div class="category-chips" id="categoryChips"></div>
  </div>

  <div class="task-list" id="taskList"></div>

<script>
  // ── State ──────────────────────────────────────────────────────────────
  let tasks  = [];
  let filter = 'all';
  let editingId = null;
  let categories = [];
  let currentCategoryId = null; // null = root/"All"
  let addingCategory = false;
  let doneWindow = 'all'; // 'today' | 'week' | 'month' | 'all' — only relevant when filter === 'done'

  const STORAGE_KEY    = 'todo_tasks_v1';
  const CATEGORIES_KEY = 'todo_categories_v1';

  // ── Persistence ────────────────────────────────────────────────────────
  function load() {
    try {
      tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    } catch {
      tasks = [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (e) {
      console.warn('Storage write failed:', e);
    }
  }

  function loadCategories() {
    try {
      categories = JSON.parse(localStorage.getItem(CATEGORIES_KEY) || '[]');
    } catch {
      categories = [];
    }
  }

  function saveCategories() {
    try {
      localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
    } catch (e) {
      console.warn('Storage write failed:', e);
    }
  }

  // ── Task operations ────────────────────────────────────────────────────
  function addTask() {
    const input = document.getElementById('taskInput');
    const text  = input.value.trim();
    if (!text) {
      input.focus();
      return;
    }

    tasks.unshift({
      id:        Date.now(),
      text,
      done:      false,
      createdAt: new Date().toISOString(),
      categoryId: currentCategoryId,
    });

    save();
    input.value = '';
    input.focus();
    render();
  }

  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    task.done = !task.done;
    if (task.done) task.completedAt = new Date().toISOString();
    save();
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  // Reorders by id, not raw array index: the visible list (after status AND
  // category filtering) is a scattered subset of `tasks`, so the dragged/target
  // positions from the DOM can't be spliced directly into the full array.
  // Instead: compute the new relative order of just the visible ids, then walk
  // the full array substituting visible tasks from that new order in place —
  // every non-visible task keeps its original position untouched.
  function commitReorder(visibleIds, fromIndex, toIndex) {
    if (fromIndex === toIndex) return;
    const newOrder = visibleIds.slice();
    const [movedId] = newOrder.splice(fromIndex, 1);
    newOrder.splice(toIndex, 0, movedId);

    const byId = new Map(tasks.map(t => [t.id, t]));
    const visibleSet = new Set(visibleIds);
    let cursor = 0;
    tasks = tasks.map(t => visibleSet.has(t.id) ? byId.get(newOrder[cursor++]) : t);
    save();
  }

  // ── Editing ────────────────────────────────────────────────────────────
  function startEdit(id) {
    editingId = id;
    render();
    const input = document.getElementById(`edit-${id}`);
    if (input) {
      input.focus();
      const len = input.value.length;
      input.setSelectionRange(len, len); // cursor at end, not select-all — editing should extend text, not wipe it
    }
  }

  function commitEdit(id) {
    const input = document.getElementById(`edit-${id}`);
    if (!input) return; // already committed/cancelled
    const value = input.value.trim();
    const task  = tasks.find(t => t.id === id);
    if (task && value) {
      task.text = value;
      save();
    }
    editingId = null;
    render();
  }

  function cancelEdit() {
    editingId = null;
    render();
  }

  // ── Categories (nested) ────────────────────────────────────────────────
  function getChildren(parentId) {
    return categories.filter(c => c.parentId === parentId);
  }

  function getDescendantIds(id) {
    const result = [];
    const stack  = [id];
    while (stack.length) {
      const current = stack.pop();
      for (const c of categories) {
        if (c.parentId === current) {
          result.push(c.id);
          stack.push(c.id);
        }
      }
    }
    return result;
  }

  function navigateToCategory(id) {
    currentCategoryId = id;
    render();
  }

  function navigateUp() {
    if (currentCategoryId === null) return;
    const cat = categories.find(c => c.id === currentCategoryId);
    navigateToCategory(cat ? cat.parentId : null);
  }

  // Mirrors startEdit/commitEdit/cancelEdit's inline-swap pattern, so adding a
  // category feels like the same action as adding/editing a task instead of a
  // separate native-popup interaction.
  function startAddCategory() {
    addingCategory = true;
    render();
    const input = document.getElementById('categoryAddInput');
    if (input) input.focus();
  }

  // Names must be unique app-wide (not just among siblings) — two categories
  // with the same name is confusing regardless of where they sit in the tree.
  function categoryNameExists(name, excludeId = null) {
    const lower = name.toLowerCase();
    return categories.some(c => c.id !== excludeId && c.name.toLowerCase() === lower);
  }

  function commitAddCategory() {
    const input = document.getElementById('categoryAddInput');
    addingCategory = false;
    if (!input) { render(); return; }
    const name = input.value.trim();
    if (name) {
      if (categoryNameExists(name)) {
        alert(`A category named "${name}" already exists.`);
        addingCategory = true;
        render();
        const retryInput = document.getElementById('categoryAddInput');
        if (retryInput) { retryInput.value = name; retryInput.focus(); }
        return;
      }
      categories.push({ id: Date.now(), name, parentId: currentCategoryId, createdAt: new Date().toISOString() });
      saveCategories();
    }
    render();
  }

  function cancelAddCategory() {
    addingCategory = false;
    render();
  }

  function renameOrDeleteCurrentCategory() {
    if (currentCategoryId === null) return; // can't rename/delete the root
    const cat = categories.find(c => c.id === currentCategoryId);
    if (!cat) return;

    const input = prompt('Rename category (clear the text and press OK to delete):', cat.name);
    if (input === null) return; // cancelled
    const trimmed = input.trim();

    if (trimmed === '') {
      const idsToDelete = new Set([cat.id, ...getDescendantIds(cat.id)]);
      const ok = confirm(`Delete "${cat.name}"${idsToDelete.size > 1 ? ' and its subcategories' : ''}? Tasks inside will be moved to Uncategorized — nothing is deleted.`);
      if (!ok) return;
      tasks.forEach(t => {
        if (t.categoryId !== null && t.categoryId !== undefined && idsToDelete.has(t.categoryId)) {
          t.categoryId = null;
        }
      });
      categories = categories.filter(c => !idsToDelete.has(c.id));
      currentCategoryId = cat.parentId;
      save();
      saveCategories();
      render();
      return;
    }

    if (trimmed !== cat.name) {
      if (categoryNameExists(trimmed, cat.id)) {
        alert(`A category named "${trimmed}" already exists.`);
        return;
      }
      cat.name = trimmed;
      saveCategories();
      render();
    }
  }

  function assignTaskCategory(taskId, categoryIdStr) {
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    task.categoryId = categoryIdStr === '' ? null : Number(categoryIdStr);
    save();
    render();
  }

  // ── Export / Import ────────────────────────────────────────────────────
  function exportTasks() {
    if (tasks.length === 0 && categories.length === 0) {
      alert('Nothing to export yet.');
      return;
    }

    const json     = JSON.stringify({ categories, tasks }, null, 2);
    const filename = `tasks-${new Date().toISOString().slice(0, 10)}.json`;
    const file     = new File([json], filename, { type: 'application/json' });

    // On iOS, sharing the file lets you save it to Files, AirDrop it, etc.
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Tasks backup' }).catch(() => {});
      return;
    }

    // Desktop / unsupported browsers: fall back to a plain download.
    const url = URL.createObjectURL(file);
    const a   = document.createElement('a');
    a.href     = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function handleImportFile(event) {
    const file = event.target.files[0];
    event.target.value = ''; // reset so importing the same file again still fires onchange
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch {
        alert("That file isn't valid JSON.");
        return;
      }

      // Accept the legacy bare-array format (tasks only) as well as the
      // current { categories, tasks } shape.
      let importedTasks, importedCategories;
      if (Array.isArray(parsed)) {
        importedTasks = parsed;
        importedCategories = [];
      } else if (parsed && Array.isArray(parsed.tasks)) {
        importedTasks = parsed.tasks;
        importedCategories = Array.isArray(parsed.categories) ? parsed.categories : [];
      } else {
        alert('Expected a JSON file containing tasks (and optionally categories).');
        return;
      }

      // Merge categories first, matching by (name, resolved parent) so two
      // different branches can each have a same-named child without merging
      // into one. Recursion (rather than assuming file order) resolves a
      // category's parent on demand, memoized in categoryIdRemap.
      const categoryIdRemap = new Map(); // imported category id -> final id in `categories`
      const byImportedId    = new Map(importedCategories.filter(c => c && typeof c.id !== 'undefined').map(c => [c.id, c]));

      // Category names are unique app-wide, so a name match (regardless of
      // parent) unambiguously means "this is the same category" — matched
      // ones keep their existing local placement rather than being reparented
      // to wherever the import file had them.
      function resolveCategory(importedCat) {
        if (categoryIdRemap.has(importedCat.id)) return categoryIdRemap.get(importedCat.id);

        const importedName = typeof importedCat.name === 'string' ? importedCat.name : 'Unnamed';
        const existing = categories.find(c => c.name.toLowerCase() === importedName.toLowerCase());
        if (existing) {
          categoryIdRemap.set(importedCat.id, existing.id);
          return existing.id;
        }

        let finalParentId = null;
        if (importedCat.parentId !== null && importedCat.parentId !== undefined) {
          const parentImported = byImportedId.get(importedCat.parentId);
          finalParentId = parentImported ? resolveCategory(parentImported) : null;
        }

        let finalId = Date.now() + categories.length + categoryIdRemap.size;
        while (categories.some(c => c.id === finalId)) finalId++;
        categories.push({
          id: finalId,
          name: importedName,
          parentId: finalParentId,
          createdAt: typeof importedCat.createdAt === 'string' ? importedCat.createdAt : new Date().toISOString(),
        });
        categoryIdRemap.set(importedCat.id, finalId);
        return finalId;
      }

      importedCategories.forEach(c => { if (c && typeof c.id !== 'undefined') resolveCategory(c); });

      // Merge tasks: unchanged dedupe-by-id logic, plus remapping categoryId
      // through the table built above (an unresolvable reference falls back
      // to Uncategorized rather than dropping the task).
      const existingIds = new Set(tasks.map(t => t.id));
      let added = 0, skipped = 0;

      for (const item of importedTasks) {
        if (!item || typeof item.text !== 'string' || !item.text.trim()) {
          skipped++;
          continue;
        }
        if (typeof item.id === 'number' && existingIds.has(item.id)) {
          skipped++;
          continue;
        }
        let id = typeof item.id === 'number' ? item.id : Date.now() + added;
        while (existingIds.has(id)) id++;
        existingIds.add(id);

        const categoryId = (item.categoryId !== null && item.categoryId !== undefined && categoryIdRemap.has(item.categoryId))
          ? categoryIdRemap.get(item.categoryId)
          : null;

        tasks.push({
          id,
          text:      item.text.trim(),
          done:      !!item.done,
          createdAt: typeof item.createdAt === 'string' ? item.createdAt : new Date().toISOString(),
          categoryId,
        });
        added++;
      }

      save();
      saveCategories();
      render();
      alert(`Imported ${added} task${added === 1 ? '' : 's'}.` + (skipped ? ` Skipped ${skipped} invalid/duplicate.` : ''));
    };
    reader.readAsText(file);
  }

  // ── Filter ─────────────────────────────────────────────────────────────
  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function setDoneWindow(w) {
    doneWindow = w;
    render();
  }

  // A task with no completedAt (done before this existed) falls back to
  // createdAt, so it still lands somewhere sensible instead of never
  // matching a window.
  function isWithinWindow(task, window) {
    if (window === 'all') return true;
    const ts = new Date(task.completedAt || task.createdAt).getTime();
    if (Number.isNaN(ts)) return true;
    const now = Date.now();
    const DAY = 24 * 60 * 60 * 1000;
    if (window === 'today') return new Date(ts).toDateString() === new Date(now).toDateString();
    if (window === 'week')  return now - ts < 7 * DAY;
    if (window === 'month') return now - ts < 30 * DAY;
    return true;
  }

  function renderDoneWindowChips() {
    if (filter !== 'done') return '';
    const options = [['today', 'Today'], ['week', 'Last week'], ['month', 'Last month'], ['all', 'All time']];
    const chips = options
      .map(([val, label]) => `<button class="window-btn ${doneWindow === val ? 'active' : ''}" onclick="setDoneWindow('${val}')">${label}</button>`)
      .join('');
    return `<div class="window-chips">${chips}</div>`;
  }

  // ── Render ─────────────────────────────────────────────────────────────
  function render() {
    const listEl      = document.getElementById('taskList');
    const countEl     = document.getElementById('taskCount');

    // Any open swipe or in-progress drag is visually reset by a fresh render.
    openSwipeId = null;

    // Title area (root heading, or back/name/options when inside a category),
    // the child-category chip row, and the Done-only time-window row.
    const titleGroupEl = document.getElementById('titleGroup');
    titleGroupEl.innerHTML = renderTitleGroup();
    titleGroupEl.dataset.categoryDrop = currentCategoryId === null ? '' : String(currentCategoryId);
    document.getElementById('categoryChips').innerHTML = renderCategoryChips();
    document.getElementById('doneWindowChips').innerHTML = renderDoneWindowChips();

    // A category view includes tasks filed directly in it AND anywhere in its
    // subtree — so "Done" under "Work" also shows done tasks from "Work/Client
    // A", instead of only tasks filed in "Work" itself. At root this means
    // every task in the app, which is what "All" should mean.
    const inScope = new Set([currentCategoryId, ...getDescendantIds(currentCategoryId)]);
    const categoryTasks = tasks.filter(t => inScope.has(t.categoryId ?? null));
    const total       = categoryTasks.length;
    const doneCount   = categoryTasks.filter(t => t.done).length;
    const activeCount = total - doneCount;

    // Update count label
    if (total === 0) {
      countEl.textContent = 'No tasks yet';
    } else {
      countEl.textContent = `${activeCount} remaining · ${doneCount} done`;
    }

    // Further filter by status tab (and, in Done, the time window) on top of
    // the category scope above
    const visible = categoryTasks.filter(t => {
      if (filter === 'active') return !t.done;
      if (filter === 'done')   return  t.done && isWithinWindow(t, doneWindow);
      return true;
    });

    // Empty state
    if (visible.length === 0) {
      const msgs = {
        all:    { icon: '📝', title: 'Nothing here yet',     sub: 'Type a task above and tap Add' },
        active: { icon: '✅', title: 'All caught up!',       sub: 'No active tasks remaining'     },
        done:   doneWindow === 'all'
          ? { icon: '🎯', title: 'Nothing completed yet', sub: 'Finish a task to see it here' }
          : { icon: '🎯', title: 'Nothing here',          sub: 'No tasks completed in this time range' },
      };
      const m = msgs[filter];
      listEl.innerHTML = `
        <div class="empty-state">
          <span class="empty-icon">${m.icon}</span>
          <div class="empty-title">${m.title}</div>
          <div class="empty-sub">${m.sub}</div>
        </div>`;
      return;
    }

    // Task items
    listEl.innerHTML = visible.map(task => `
      <div class="task-item-wrapper" id="task-${task.id}" data-id="${task.id}">
        <div class="delete-reveal" onclick="deleteTask(${task.id})" aria-label="Delete task">
          <span class="delete-reveal-icon">🗑</span>
        </div>
        <div class="task-row">
          <div class="check-circle ${task.done ? 'done' : ''}"
               onclick="toggleTask(${task.id})"
               role="checkbox"
               aria-checked="${task.done}"
               aria-label="Mark complete">
            <span class="checkmark">✓</span>
          </div>
          ${editingId === task.id
            ? `<input class="edit-input" id="edit-${task.id}" type="text" maxlength="300"
                      value="${escAttr(task.text)}"
                      autocomplete="off" autocorrect="on" spellcheck="true"
                      onkeydown="if(event.key==='Enter'){this.blur();}else if(event.key==='Escape'){cancelEdit();}"
                      onblur="commitEdit(${task.id})">`
            : `<div class="task-text ${task.done ? 'done' : ''}" onclick="startEdit(${task.id})">${escHtml(task.text)}</div>`
          }
          ${renderCategoryLabel(task)}
          <div class="drag-handle" aria-label="Reorder task" aria-hidden="true">⠿</div>
        </div>
      </div>
    `).join('');
  }

  function renderTitleGroup() {
    if (currentCategoryId === null) {
      return `<h1>Tasks v6</h1>`;
    }
    const cat  = categories.find(c => c.id === currentCategoryId);
    const name = cat ? escHtml(cat.name) : 'Category';
    return `
      <button class="back-btn" onclick="navigateUp()" aria-label="Back">‹</button>
      <h1 class="category-title">${name}</h1>
      <button class="more-btn" onclick="renameOrDeleteCurrentCategory()" aria-label="Category options">⋯</button>
    `;
  }

  function renderCategoryChips() {
    const children = getChildren(currentCategoryId);
    const chips = children
      .map(c => `<button class="filter-btn" data-category-drop="${c.id}" onclick="navigateToCategory(${c.id})">${escHtml(c.name)}</button>`)
      .join('');
    const addControl = addingCategory
      ? `<input class="category-add-input" id="categoryAddInput" type="text" maxlength="60"
                placeholder="Category name" autocomplete="off"
                onkeydown="if(event.key==='Enter'){this.blur();}else if(event.key==='Escape'){cancelAddCategory();}"
                onblur="commitAddCategory()">`
      : `<button class="filter-btn" onclick="startAddCategory()" aria-label="Add category">+</button>`;
    return chips + addControl;
  }

  // Passive indicator only — re-filing a task is done by dragging it onto a
  // category chip or the title area (see startDrag/onDragMove/onDragEnd),
  // not by picking from a control here. Only shown when the task's actual
  // category differs from the one currently being browsed, since that's the
  // only time it's not already obvious (aggregated views mix subcategories).
  function renderCategoryLabel(task) {
    const taskCategoryId = task.categoryId ?? null;
    if (taskCategoryId === currentCategoryId) return '';
    const cat  = categories.find(c => c.id === taskCategoryId);
    const name = cat ? cat.name : 'Uncategorized';
    return `<span class="category-label">${escHtml(name)}</span>`;
  }

  // ── Helpers ────────────────────────────────────────────────────────────
  function escHtml(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(str));
    return d.innerHTML;
  }

  function escAttr(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ── Keyboard ───────────────────────────────────────────────────────────
  document.getElementById('taskInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  // ── Swipe-to-delete & drag-to-reorder ────────────────────────────────────
  // Both are implemented with pointer events (works for touch AND mouse) via
  // delegation on the list container, so listeners survive full re-renders.
  const taskListEl = document.getElementById('taskList');

  const SWIPE_OPEN      = -76; // px the row slides to reveal the delete button
  const SWIPE_THRESHOLD = 40;  // px drag needed to toggle open/closed

  let openSwipeId      = null; // id of the currently swiped-open row, if any
  let swipeState       = null;
  let dragState        = null;
  let suppressClick    = false;
  let highlightedDropEl = null; // category chip/title currently hovered while dragging

  function updateDropHighlight(dropEl) {
    if (highlightedDropEl === dropEl) return;
    if (highlightedDropEl) highlightedDropEl.classList.remove('drop-target-hover');
    highlightedDropEl = dropEl || null;
    if (highlightedDropEl) highlightedDropEl.classList.add('drop-target-hover');
  }

  // A capturing click listener lets us swallow the "tap" that merely closed
  // an open swipe, so it doesn't also fire the checkbox/edit handler beneath it.
  taskListEl.addEventListener('click', e => {
    if (suppressClick) {
      suppressClick = false;
      e.stopPropagation();
      e.preventDefault();
    }
  }, true);

  taskListEl.addEventListener('pointerdown', e => {
    suppressClick = false;

    const wrapperEl = e.target.closest('.task-item-wrapper');
    const targetId  = wrapperEl ? Number(wrapperEl.dataset.id) : null;

    // Tapping/dragging anywhere while a different row is swiped open just
    // closes that row first.
    if (openSwipeId !== null && openSwipeId !== targetId) {
      closeSwipe();
      suppressClick = true;
    }

    const handle    = e.target.closest('.drag-handle');
    const deleteBtn = e.target.closest('.delete-reveal');
    const row       = e.target.closest('.task-row');

    if (deleteBtn) return; // let its own onclick handle deletion

    if (handle) {
      startDrag(e, handle);
    } else if (row) {
      startSwipe(e, row);
    }
  });

  function closeSwipe() {
    if (openSwipeId == null) return;
    const row = taskListEl.querySelector(`#task-${openSwipeId} .task-row`);
    if (row) {
      row.style.transition = 'transform 0.2s ease';
      row.style.transform  = 'translateX(0px)';
    }
    openSwipeId = null;
  }

  function startSwipe(e, row) {
    const wrapper = row.closest('.task-item-wrapper');
    const id      = Number(wrapper.dataset.id);
    const isOpen  = openSwipeId === id;

    swipeState = {
      id, row,
      pointerId: e.pointerId,
      startX: e.clientX,
      startY: e.clientY,
      baseX:  isOpen ? SWIPE_OPEN : 0,
      wasOpen: isOpen,
      decided: null, // null (undecided) | 'swipe' | 'scroll'
    };

    // Pointer capture is deferred to onSwipeMove, once a swipe is actually
    // confirmed — capturing here would retarget the plain-tap click event to
    // the row itself, breaking checkbox toggling and tap-to-edit.
    row.style.transition = 'none';
    row.addEventListener('pointermove', onSwipeMove);
    row.addEventListener('pointerup', onSwipeEnd);
    row.addEventListener('pointercancel', onSwipeEnd);
  }

  function onSwipeMove(e) {
    if (!swipeState) return;
    const dx = e.clientX - swipeState.startX;
    const dy = e.clientY - swipeState.startY;

    if (swipeState.decided === null) {
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
        swipeState.decided = 'swipe';
        // Capture now (not on pointerdown) so a plain tap's click event
        // still targets the checkbox/text underneath undisturbed.
        swipeState.row.setPointerCapture(swipeState.pointerId);
      } else if (Math.abs(dy) > 8) {
        swipeState.decided = 'scroll';
      }
    }

    if (swipeState.decided !== 'swipe') return;

    const x = Math.max(SWIPE_OPEN, Math.min(0, swipeState.baseX + dx));
    swipeState.row.style.transform = `translateX(${x}px)`;
  }

  function onSwipeEnd(e) {
    if (!swipeState) return;
    const { row, id, decided, wasOpen } = swipeState;
    row.removeEventListener('pointermove', onSwipeMove);
    row.removeEventListener('pointerup', onSwipeEnd);
    row.removeEventListener('pointercancel', onSwipeEnd);

    if (decided === 'swipe') {
      const dx      = e.clientX - swipeState.startX;
      const finalX  = swipeState.baseX + dx;
      const shouldOpen = finalX < -SWIPE_THRESHOLD;
      row.style.transition = 'transform 0.2s ease';
      row.style.transform  = shouldOpen ? `translateX(${SWIPE_OPEN}px)` : 'translateX(0px)';
      openSwipeId = shouldOpen ? id : null;
    } else if (decided === null && wasOpen) {
      // A plain tap on a row that was already open just closes it.
      row.style.transition = 'transform 0.2s ease';
      row.style.transform  = 'translateX(0px)';
      openSwipeId = null;
      suppressClick = true;
    }
    // Otherwise (plain tap on a closed row, or a vertical scroll): do
    // nothing and let the native click fire on the checkbox/text beneath.

    swipeState = null;
  }

  function startDrag(e, handle) {
    const wrapper    = handle.closest('.task-item-wrapper');
    const wrappers   = Array.from(taskListEl.querySelectorAll('.task-item-wrapper'));
    const startIndex = wrappers.indexOf(wrapper); // index within the visible list, not the full `tasks` array
    if (startIndex === -1) return;

    const visibleIds = wrappers.map(w => Number(w.dataset.id));
    const gap        = 8; // must match .task-list { gap: 8px }
    const itemHeight = wrapper.getBoundingClientRect().height + gap;

    dragState = { startIndex, currentIndex: startIndex, startY: e.clientY, itemHeight, wrapper, wrappers, visibleIds, dropTarget: undefined };

    wrapper.classList.add('dragging');
    // The dragged row otherwise occludes whatever is really underneath it
    // (it paints above normal-flow siblings while its z-index is raised),
    // which would make elementFromPoint find itself instead of the chip/
    // header actually being hovered — so it's excluded from hit-testing.
    wrapper.style.pointerEvents = 'none';
    handle.setPointerCapture(e.pointerId);
    handle.addEventListener('pointermove', onDragMove);
    handle.addEventListener('pointerup', onDragEnd);
    handle.addEventListener('pointercancel', onDragEnd);
  }

  function onDragMove(e) {
    if (!dragState) return;
    const dy = e.clientY - dragState.startY;
    dragState.wrapper.style.transform = `translateY(${dy}px)`;

    // Dragging onto a category chip or the title area re-files the task
    // there instead of reordering it — check that before the reorder math.
    const dropEl = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-category-drop]');
    updateDropHighlight(dropEl || null);

    if (dropEl) {
      dragState.dropTarget = dropEl.dataset.categoryDrop;
      dragState.currentIndex = dragState.startIndex; // no reorder while re-filing
      dragState.wrappers.forEach(w => {
        if (w !== dragState.wrapper) w.style.transform = '';
      });
      return;
    }
    dragState.dropTarget = undefined;

    let newIndex = dragState.startIndex + Math.round(dy / dragState.itemHeight);
    newIndex = Math.max(0, Math.min(dragState.wrappers.length - 1, newIndex));

    dragState.wrappers.forEach((w, i) => {
      if (w === dragState.wrapper) return;
      let shift = 0;
      if (dragState.startIndex < newIndex && i > dragState.startIndex && i <= newIndex) {
        shift = -dragState.itemHeight;
      } else if (dragState.startIndex > newIndex && i < dragState.startIndex && i >= newIndex) {
        shift = dragState.itemHeight;
      }
      w.style.transition = 'transform 0.15s ease';
      w.style.transform  = shift ? `translateY(${shift}px)` : '';
    });

    dragState.currentIndex = newIndex;
  }

  function onDragEnd(e) {
    if (!dragState) return;
    const { wrapper, wrappers, startIndex, currentIndex, visibleIds, dropTarget } = dragState;

    e.target.removeEventListener('pointermove', onDragMove);
    e.target.removeEventListener('pointerup', onDragEnd);
    e.target.removeEventListener('pointercancel', onDragEnd);

    wrappers.forEach(w => {
      w.style.transition = '';
      w.style.transform  = '';
    });
    wrapper.classList.remove('dragging');
    wrapper.style.pointerEvents = '';
    updateDropHighlight(null);
    dragState = null;

    if (dropTarget !== undefined) {
      assignTaskCategory(visibleIds[startIndex], dropTarget); // already re-renders
    } else {
      commitReorder(visibleIds, startIndex, currentIndex);
      render();
    }
  }

  // ── Offline detection ─────────────────────────────────────────────────
  function updateOnlineStatus() {
    document.getElementById('offlineBanner')
      .classList.toggle('visible', !navigator.onLine);
  }
  window.addEventListener('online',  updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
  updateOnlineStatus();

  // ── Service Worker ────────────────────────────────────────────────────
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg  => console.log('SW registered:', reg.scope))
        .catch(err => console.warn('SW registration failed:', err));
    });
  }

  // ── Boot ───────────────────────────────────────────────────────────────
  load();
  loadCategories();
  render();
</script>
</body>
</html>
